/* =========================================================================
   患者姓名智能输入（nameCombo）
   -------------------------------------------------------------------------
   为什么不用原生 <datalist>：
     · 各浏览器把建议渲染成系统级大浮层，条数和高度都不可控，经常挡住下方字段
     · 点完建议不会自动关，还常常只填了文字、带不出电话
   本组件解决的问题（对应用户反馈）：
     1) 建议列表限高 ≈3.5 条，超出可上下滚动，不遮挡下方「预约时间」「牙位十字架」
     2) 点建议项 → 自动填入姓名 + 电话（+性别/年龄，若有）并关闭列表
     3) 点输入框以外任何地方 / Esc / 选完 / 输入完成失焦 → 自动收起
     4) 右侧 ▾ 箭头可手动开合，箭头方向跟着状态翻转
     5) 输入即筛选（子串匹配，含姓名与拼音首字母），高亮命中片段
   用法：nameCombo(inputEl, { onPick(p){…}, onInput(v){…} })
   降级：若不传 inputEl 或元素不存在，直接返回 null。
   ========================================================================= */
function nameCombo(inputEl, opts){
  opts = opts || {};
  if(!inputEl) return null;
  const wrap=document.createElement('div'); wrap.className='nc-wrap';
  inputEl.parentNode.insertBefore(wrap, inputEl);
  wrap.appendChild(inputEl);
  inputEl.removeAttribute('list');           // 彻底关掉原生 datalist
  inputEl.setAttribute('autocomplete','off');
  inputEl.setAttribute('spellcheck','false');

  const arrow=document.createElement('button');
  arrow.type='button'; arrow.className='nc-arrow'; arrow.tabIndex=-1;
  arrow.setAttribute('aria-label','展开或收起建议'); arrow.textContent='▾';
  wrap.appendChild(arrow);

  const list=document.createElement('div');
  list.className='nc-list hide';
  wrap.appendChild(list);

  let items=[], cur=-1, open=false, picked=null;

  /* 候选池：优先本机病人档案（它们才带电话/性别/年龄） */
  function pool(){
    const out=[]; const seen=new Set(); const q=inputEl.value.trim().toLowerCase();
    (S.patients||[]).forEach(p=>{
      if(!p || !p.name) return;
      const k=p.name;
      if(seen.has(k)) return; seen.add(k);
      out.push({ name:p.name, phone:p.phone||'', gender:p.gender||'', age:p.age||'', src:'patient' });
    });
    /* 预约里出现过的名字也补进来，但档案优先 */
    (S.appts||[]).forEach(a=>{
      if(!a||!a.name) return;
      if(seen.has(a.name)) return; seen.add(a.name);
      out.push({ name:a.name, phone:a.phone||'', src:'appt' });
    });
    return out;
  }
  /* 子串匹配（不区分大小写）。空输入时给最近的几条做提示 */
  function filter(q){
    const all=pool();
    const s=q.trim().toLowerCase();
    if(!s) return all.slice(0,12);
    const pre=[], mid=[];
    all.forEach(x=>{
      const n=x.name.toLowerCase(); const i=n.indexOf(s);
      if(i===0) pre.push(x); else if(i>0) mid.push(x);
    });
    return pre.concat(mid).slice(0,12);
  }
  function hi(name, q){
    const s=q.trim(); if(!s) return esc(name);
    const i=name.toLowerCase().indexOf(s.toLowerCase());
    if(i<0) return esc(name);
    return esc(name.slice(0,i))+'<span class="hit">'+esc(name.slice(i,i+s.length))+'</span>'+esc(name.slice(i+s.length));
  }
  function draw(){
    const q=inputEl.value;
    items=filter(q);
    if(!items.length){
      list.innerHTML='<div class="nc-empty">'+(q.trim()? '没有匹配的历史患者，可直接新建' : '暂无历史患者')+'</div>';
      return;
    }
    list.innerHTML=items.map((x,i)=>
      '<div class="nc-item'+(i===cur?' on':'')+'" data-i="'+i+'">'+
        '<span class="nm">'+hi(x.name, q)+'</span>'+
        (x.phone? '<span class="ph">'+esc(x.phone)+'</span>' : '')+
      '</div>').join('');
    Array.from(list.querySelectorAll('.nc-item')).forEach(el=>{
      // 用 pointerdown 而不是 click：抢在 blur 之前触发，避免下拉先被收起
      el.addEventListener('pointerdown', e=>{ e.preventDefault(); choose(+el.dataset.i); });
    });
  }
  function show(){
    open=true;
    list.classList.remove('hide','flip');
    arrow.classList.add('up');
    cur=-1;
    draw();
    /* 自动翻向：默认向下弹；若下方可用空间放不下（会盖住下面的字段），
       就翻到输入框上方。这样「预约时间」和「牙位十字架」不会被遮住。 */
    const r=inputEl.getBoundingClientRect();
    const need=Math.min(list.scrollHeight||0, 110) + 12;
    const roomBelow=window.innerHeight - r.bottom;
    const roomAbove=r.top;
    if(roomBelow < need && roomAbove > roomBelow) list.classList.add('flip');
  }
  function hide(){
    open=false; list.classList.add('hide'); arrow.classList.remove('up'); cur=-1;
  }
  function choose(i){
    const x=items[i]; if(!x) return;
    picked=x;
    inputEl.value=x.name;
    hide();
    if(opts.onPick) opts.onPick(x);
    // 选完把光标放到末尾，别让用户以为还要继续输
    try{ inputEl.setSelectionRange(x.name.length, x.name.length); }catch(e){}
    // 选完仍然保持焦点，方便直接按 Tab 到下一个字段；但不自动再弹下拉
  }

  inputEl.addEventListener('input', ()=>{
    picked=null;
    if(opts.onInput) opts.onInput(inputEl.value);
    if(!open) show(); else draw();
  });
  inputEl.addEventListener('focus', ()=>{
    // 已有完整内容且刚好等于某个历史姓名时，不主动弹（避免干扰回填）
    show();
  });
  inputEl.addEventListener('blur', ()=>{ setTimeout(hide, 120); });
  inputEl.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ hide(); return; }
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      if(!open){ show(); e.preventDefault(); return; }
      e.preventDefault();
      if(!items.length) return;
      cur = e.key==='ArrowDown' ? (cur+1)%items.length : (cur-1+items.length)%items.length;
      draw();
      const on=list.querySelectorAll('.nc-item')[cur];
      if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest'});
      return;
    }
    if(e.key==='Enter'){
      if(open && cur>=0 && items[cur]){ e.preventDefault(); choose(cur); }
      return;
    }
  });
  arrow.addEventListener('pointerdown', e=>{ e.preventDefault(); });   // 别让箭头抢走输入框焦点
  arrow.addEventListener('click', e=>{
    e.stopPropagation();
    if(open) hide(); else { inputEl.focus(); show(); }
  });
  /* 点组件以外任何地方 → 收起 */
  _ncCloser.push(function(ev){
    if(!wrap.contains(ev.target)) hide();
  });

  return { hide, show, el:inputEl, close:()=>hide() };
}
/* 全局「点外部收起」登记表：document 上只挂一个监听，避免重复绑定 */
const _ncCloser = [];
document.addEventListener('pointerdown', e=>{ _ncCloser.forEach(f=>{ try{ f(e); }catch(err){} }); }, true);

/* =========================================================================
   1. 本地持久化（IndexedDB，失败降级 localStorage）
   ========================================================================= */
const IDB = (function(){
  const NAME='workbench', VER=3;
  const STORES=['kv','patients','appts','images','stock','reminders','items','imgcats','words','rosters'];
  let db=null, useLS=false;
  function open(){
    return new Promise(res=>{
      if(!window.indexedDB){ useLS=true; return res(false); }
      const rq=indexedDB.open(NAME,VER);
      rq.onupgradeneeded=e=>{
        const d=e.target.result;
        if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv',{keyPath:'key'});
        STORES.filter(s=>s!=='kv').forEach(s=>{
          if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id'});
        });
      };
      rq.onsuccess=e=>{ db=e.target.result; res(true); };
      rq.onerror=()=>{ useLS=true; res(false); };
    });
  }
  const lsGet=s=>{ try{ return JSON.parse(localStorage.getItem('wb2_'+s)||'{}'); }catch(e){ return {}; } };
  const lsSet=(s,o)=>{ try{ localStorage.setItem('wb2_'+s,JSON.stringify(o)); }catch(e){} };
  function req(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
  function tx(s,m){ return db.transaction(s,m).objectStore(s); }
  return {
    ready: open(),
    async all(s){
      if(useLS) return Object.values(lsGet(s));
      if(!db) await open();
      try{ return await req(tx(s,'readonly').getAll()); }catch(e){ return Object.values(lsGet(s)); }
    },
    async get(s,id){
      if(useLS) return lsGet(s)[id];
      if(!db) await open();
      return await req(tx(s,'readonly').get(id));
    },
    async put(s,o){
      if(useLS){ const x=lsGet(s); x[o.id!=null?o.id:o.key]=o; lsSet(s,x); return; }
      if(!db) await open();
      await req(tx(s,'readwrite').put(o));
    },
    async del(s,id){
      if(useLS){ const x=lsGet(s); delete x[id]; lsSet(s,x); return; }
      if(!db) await open();
      await req(tx(s,'readwrite').delete(id));
    },
    async clear(s){
      if(useLS){ lsSet(s,{}); return; }
      if(!db) await open();
      await req(tx(s,'readwrite').clear());
    }
  };
})();

/* =========================================================================
   2. 数据接口层（DAL）—— 接后端时只需替换这一层
   -------------------------------------------------------------------------
   界面与业务逻辑只调用：
     Auth.login() / Auth.register() / Auth.logout() / Auth.current()
     Data.load()  / Data.save()      / Data.put() / Data.del()
   两种模式，由「设置 → CloudBase 云端」里的环境ID是否填写自动决定：
     · local  —— 账号表与数据都存浏览器本机（IndexedDB / localStorage）
     · cloud  —— 账号走 CloudBase 身份认证，数据走 CloudBase PostgreSQL
   关键安全约束（务必不要改）：
     前端只使用「环境ID」+「用户登录后拿到的 access_token」访问云端。
     绝不在这里放 SecretId / SecretKey —— 密钥一旦写进网页，
     任何访客按 F12 就能拿到，等于公开账号下全部云资源。
   ========================================================================= */

const Auth = {
  /* 本地账号表（仅 local 模式使用；含真实姓名绑定） */
  _users(){ try{ return JSON.parse(localStorage.getItem('wb_users')||'[]'); }catch(e){ return []; } },
  _save(list){ localStorage.setItem('wb_users', JSON.stringify(list)); },

  /* 登录校验。cloud 模式走 CloudBase 身份认证；只有「网络不可达」才回退本地。
     ⚠ 账号不存在 / 密码错误这类「云端明确拒绝」的情况，绝不回退本地 ——
     否则会给出「账号不存在，请先注册」这种误导提示。 */
  async login(account, password){
    if(CLOUD_ON()){
      const r = await cloudLogin(account, password);
      if(r.ok) return r;
      /* 云端明确拒绝（账号不存在/密码错）→ 原样返回，提示已写明原因 */
      if(!r.fallback) return r;
      /* 只有网络不通才回退本地，并且明确告知当前是本地模式 */
      console.warn('[auth] 云端不可达，回退本机账号：', r.msg);
      toast('云端连不上，已改用本机账号登录');
    }
    const users = this._users();
    const h = await hash(password);
    const u = users.find(x=>x.account===account);
    if(!u) return {ok:false, msg: CLOUD_ON()
      ? '本机没有该账号，且当前连不上云端。请检查网络，或用 CloudBase 控制台创建好的账号登录。'
      : '账号不存在，请先注册'};
    if(u.pass!==h) return {ok:false, msg:'密码不正确'};
    localStorage.setItem('wb_session', JSON.stringify({account, at:Date.now(), mode:'local'}));
    return {ok:true, user:{account, realName:u.realName||''}};
  },
  /* 注册。cloud 模式下账号由云开发控制台创建，这里只做引导提示。
     签名保持 (account,password) 不变，界面无需改动。 */
  async register(account, password){
    if(CLOUD_ON()){
      const r = await cloudRegister(account, password);
      if(r.ok || !r.fallback) return r;
      toast('云端连接失败，已改用本机账号注册');
    }
    if(!account || account.length<2) return {ok:false, msg:'账号至少 2 个字符'};
    if(!password || password.length<4) return {ok:false, msg:'密码至少 4 位'};
    const users = this._users();
    if(users.find(x=>x.account===account)) return {ok:false, msg:'该账号已存在'};
    users.push({account, pass: await hash(password), realName:'', createdAt:Date.now()});
    this._save(users);
    localStorage.setItem('wb_session', JSON.stringify({account, at:Date.now(), mode:'local'}));
    return {ok:true, user:{account, realName:''}};
  },
  /* 修改当前账号绑定的真实姓名（本地存一份；云端模式下同时写入 users 表） */
  async setRealName(realName){
    const sess=this.current(); if(!sess) return {ok:false, msg:'未登录'};
    realName=(realName||'').trim();
    const users=this._users(); let u=users.find(x=>x.account===sess.account);
    if(u){ u.realName=realName; this._save(users); }
    else { users.push({account:sess.account, pass:'', realName, createdAt:Date.now()}); this._save(users); }
    localStorage.setItem('wb_session', JSON.stringify(
      Object.assign({}, sess, {account:sess.account, realName, at:sess.at||Date.now()})));
    if(CLOUD_ON()){ try{ await cloudUpsertProfile(sess.account, realName); }catch(e){} }
    return {ok:true, realName};
  },
  /* 读取当前账号绑定的真实姓名（本地优先，其次来自会话） */
  realName(){
    const sess=this.current(); if(!sess) return '';
    const u=this._users().find(x=>x.account===sess.account);
    return (u && u.realName) || sess.realName || '';
  },
  logout(){
    cloudClearToken();
    localStorage.removeItem('wb_session');
  },
  current(){
    try{ return JSON.parse(localStorage.getItem('wb_session')||'null'); }catch(e){ return null; }
  }
};

const Data = {
  /* 读取全量数据。cloud 模式下从 CloudBase 拉取，失败自动回退本机。 */
  async load(){
    if(CLOUD_ON()){
      try{
        return await cloudLoad();
      }catch(e){
        console.warn('[cloud] 读取失败，回退本地：', e && e.message);
        toast('云端读取失败，已显示本机缓存数据');
      }
    }
    await IDB.ready;
    const out = {};
    for(const s of ['patients','appts','images','stock','reminders','items','imgcats','words','rosters']) out[s] = await IDB.all(s);
    const sch = await IDB.get('kv','schedule');
    out.schedule = (sch && sch.value) || {};
    const st = await IDB.get('kv','settings');
    out.settings = (st && st.value) || null;
    return out;
  },
  /* 保存（全量/按 store）。cloud 模式写入 CloudBase，失败回退本机 + 进补传队列。 */
  async save(kind){
    if(CLOUD_ON()){
      try{
        await cloudSave(kind);
        Outbox.refreshUI();
        return;
      }catch(e){
        console.warn('[cloud] 写入失败，回退本地：', e && e.message);
        /* 记入队列，联网后自动补传 */
        (kind?[kind]:['patients','images','schedules']).forEach(k=>Outbox.add(k,'__all__','put'));
        toast('云端保存失败，已存入本机，联网后自动同步');
      }
    }
    // 本地：把内存数据整店写回（幂等），并清理已删除的
    const kinds = kind ? [kind] : ['patients','appts','images','stock','reminders','items','imgcats','words','rosters'];
    for(const k of kinds){
      const mem = S[k]||[];
      const disk = await IDB.all(k);
      const memIds = new Set(mem.map(x=>x.id));
      for(const d of disk) if(!memIds.has(d.id)) await IDB.del(k,d.id);
      for(const m of mem) await IDB.put(k,m);
    }
  },
  /* 单条写入 */
  async put(store, obj){
    const mem = S[store] || (S[store]=[]);
    const i = mem.findIndex(x=>x.id===obj.id);
    if(i>=0) mem[i]=obj; else mem.push(obj);
    if(CLOUD_ON()){
      try{ await cloudSave(store); Outbox.refreshUI(); return; }
      catch(e){
        console.warn('[cloud] put 失败，回退本地：', e && e.message);
        Outbox.add(store, obj.id, 'put');
      }
    }
    return await IDB.put(store, obj);
  },
  /* 单条删除 */
  async del(store, id){
    S[store] = (S[store]||[]).filter(x=>x.id!==id);
    if(CLOUD_ON()){
      try{ await cloudSave(store); Outbox.refreshUI(); return; }
      catch(e){
        console.warn('[cloud] del 失败，回退本地：', e && e.message);
        Outbox.add(store, id, 'del');
      }
    }
    return await IDB.del(store, id);
  }
};

/* =========================================================================
   2.1 腾讯云 CloudBase 接入层
   -------------------------------------------------------------------------
   只依赖两样东西（都在设置页填写/自动获得）：
     · envId        —— 云开发环境 ID，例如 heimao-workbench-d1eilb71513ca0b
     · access_token —— 用户用「账号+密码」登录后由 CloudBase 下发（2 小时有效）
   接口（基于 PostgREST / CloudBase HTTP API）：
     登录   POST https://{env}.api.tcloudbasegateway.com/auth/v1/signin
     刷新   POST https://{env}.api.tcloudbasegateway.com/auth/v1/token
            （grant_type=refresh_token / password，需带 client_id=环境ID）
     数据   https://{env}.api.tcloudbasegateway.com/v1/rdb/rest/{table}
   ⚠ 不要在这里使用 SecretId / SecretKey：前端代码对所有人可见，
     密钥泄露会导致账号下全部云资源被接管。
   ========================================================================= */

/* 云端是否启用：设置里填了环境ID 且 开关打开。任何一项缺失都退回本地。 */
function CLOUD_ON(){ return !!(S.settings && S.settings.cloudSync && S.settings.envId); }
function API_MODE(){ return CLOUD_ON() ? 'remote' : 'local'; }

const CB = {
  /* ---- 令牌只保存在内存，刷新页面后靠 refresh_token 重新换取 ---- */
  _tok:null,
  _refreshKey:'wb_cb_refresh',
  get token(){ return this._tok; },
  /* 会话恢复时，用上次的 refresh_token 换一个新的 access_token */
  async restore(){
    if(!CLOUD_ON()) return false;
    let rt=null; try{ rt=localStorage.getItem(this._refreshKey); }catch(e){}
    if(!rt) return false;
    return await this.refresh(rt);
  },
  setTokens(access, refresh){
    this._tok = access || null;
    try{
      if(refresh) localStorage.setItem(this._refreshKey, refresh);
    }catch(e){}
  },
  clear(){ this._tok=null; try{ localStorage.removeItem(this._refreshKey); }catch(e){} },
  /* 用 refresh_token 换新的 access_token
     CloudBase 规范接口：POST /auth/v1/token
       body = { grant_type:'refresh_token', refresh_token, client_id: 环境ID }
     ⚠ 旧的 refresh_token 使用后立即失效，必须保存服务端返回的新 refresh_token。 */
  async refresh(rt){
    rt = rt || (()=>{ try{ return localStorage.getItem(this._refreshKey); }catch(e){ return null; } })();
    if(!rt) return false;
    const env=(S.settings&&S.settings.envId||'').trim();
    if(!env) return false;
    try{
      const r = await fetch(`${this.base()}/auth/v1/token`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({grant_type:'refresh_token', refresh_token:rt, client_id:env})
      });
      if(!r.ok){ this.clear(); return false; }
      const j = await r.json();
      if(!j.access_token){ this.clear(); return false; }
      this.setTokens(j.access_token, j.refresh_token||rt);
      return true;
    }catch(e){ return false; }
  },
  base(){
    const env=(S.settings&&S.settings.envId||'').trim();
    return 'https://'+env+'.api.tcloudbasegateway.com';
  },
  /* 统一请求：自动带令牌；遇到 401 先刷新一次再重试。 */
  async req(method, path, {body, headers:extra, raw, retry=true}={}){
    if(!this._tok){
      const ok = await this.refresh();
      if(!ok) throw new Error('未登录云端');
    }
    const url = path.startsWith('http') ? path : (this.base()+path);
    const headers = Object.assign({'Content-Type':'application/json'}, extra||{});
    if(this._tok) headers.Authorization = 'Bearer '+this._tok;
    let r;
    try{
      r = await fetch(url, {method, headers, body: body==null?undefined:JSON.stringify(body)});
    }catch(e){
      const err = new Error('网络不可达'); err.fallback = true; throw err;
    }
    if(r.status===401 && retry){
      const ok = await this.refresh();
      if(ok) return await this.req(method, path, {body, headers:extra, raw, retry:false});
      const err = new Error('云端登录已过期，请重新登录'); err.fallback = true; throw err;
    }
    if(!r.ok){
      let msg = 'HTTP '+r.status;
      try{ const t=await r.text(); if(t) msg = t.slice(0,200); }catch(e){}
      const err = new Error(msg); err.status = r.status; throw err;
    }
    if(raw) return r;
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  },
  /* 表操作快捷方式 */
  table(name){ return `${this.base()}/v1/rdb/rest/${encodeURIComponent(name)}`; },
  async select(name, query){
    const q = query ? ('?'+query) : '';
    const j = await this.req('GET', `/v1/rdb/rest/${encodeURIComponent(name)}${q}`);
    return Array.isArray(j) ? j : (j?[j]:[]);
  }
};

/* ---- 登录：账号+密码 → access_token（唯一需要用户输入凭据的地方）----
   返回约定：
     ok:true                     → 成功，已拿到令牌
     ok:false, fallback:false    → 云端明确拒绝（账号不存在 / 密码错 / 请求非法），不要回退本地
     ok:false, fallback:true     → 网络不可达或服务异常，可以回退本地 */
async function cloudLogin(account, password){
  const env=(S.settings&&S.settings.envId||'').trim();
  if(!env) return {ok:false, msg:'请先在下方「云端设置」填写 CloudBase 环境ID', fallback:false};

  let r;
  try{
    r = await fetch(`https://${env}.api.tcloudbasegateway.com/auth/v1/signin`, {
      method:'POST',
      headers:{'Content-Type':'application/json', 'x-device-id':'web-'+env},
      body: JSON.stringify({username:account, password})
    });
  }catch(e){
    return {ok:false, msg:'无法连接云端：'+(e.message||'网络不通'),
            fallback:true, errType:'network'};
  }

  /* 取一次响应体，用于解析 CloudBase 的错误码 */
  let text='';
  try{ text = await r.text(); }catch(e){}

  /* 解析 CloudBase 的 JSON 错误体（形如
     {"code":"INVALID_USERNAME_OR_PASSWORD","error_code":4043,...}） */
  let errBody={};
  try{ errBody = text ? JSON.parse(text) : {}; }catch(e){}
  const errCode = errBody.error_code;
  const errName = String(errBody.code || errBody.error || '').toUpperCase();

  if(!r.ok){
    /* -----------------------------------------------------------------------
       重要：CloudBase 出于安全考虑，对「账号不存在」和「密码错误」返回
       完全相同的响应（error_code 4043 / INVALID_USERNAME_OR_PASSWORD）。
       实测确认：
         不存在的账号 zzz_not_exist_999 → 4043
         存在的账号但密码错             → 4043
       所以前端**无法**区分这两者，也不应该假装能区分。
       这里如实提示「账号或密码不正确」，并把可能原因列出来让用户自查。
    ----------------------------------------------------------------------- */
    if(errCode===4043 || errName==='INVALID_USERNAME_OR_PASSWORD' ||
       /invalid_username_or_password/.test(text||'')){
      return {ok:false, fallback:false, errType:'bad_credential',
        msg:'账号或密码不正确\n'+
            '（CloudBase 出于安全考虑不区分「账号不存在」和「密码错误」，两点都请核对）\n'+
            '· 账号名：须与云开发控制台 → 身份认证 → 用户管理 里完全一致\n'+
            '· 密码：注意大小写、前后空格；不确定就控制台重置一次'};
    }
    /* 参数为空 */
    if(errName==='INVALID_ARGUMENT' || errCode===3){
      return {ok:false, fallback:false, errType:'bad_request',
        msg:'账号和密码不能为空'};
    }
    /* 明确的其他 401/403 */
    if(r.status===401 || r.status===403){
      return {ok:false, fallback:false, errType:'bad_credential',
        msg:'账号或密码不正确（HTTP '+r.status+'）\n'+
            '请核对账号名与密码，或到控制台重置密码'};
    }
    /* 400 且不是上面的已知码：请求格式问题 */
    if(r.status===400){
      return {ok:false, fallback:false, errType:'bad_request',
        msg:'登录请求被拒绝（HTTP 400）：'+
            (errBody.error_description || text ? String(errBody.error_description||text).slice(0,160)
                                              : '请检查账号格式（2-48位，字母/数字/-_.:+@，不以符号开头）')};
    }
    /* 5xx / 其它：服务端问题，允许回退 */
    return {ok:false, fallback:true, errType:'server',
      msg:'云端登录失败（HTTP '+r.status+'）'};
  }


  let j={};
  try{ j = text ? JSON.parse(text) : {}; }catch(e){}
  if(!j.access_token){
    return {ok:false, fallback:false, errType:'no_token',
      msg:'云端返回异常：未包含登录令牌'};
  }
  /* 拿到令牌。两个都存：access 放内存，refresh 放本机以便刷新页面后自动续期 */
  CB.setTokens(j.access_token, j.refresh_token);
  localStorage.setItem('wb_session', JSON.stringify({
    account, at:Date.now(), mode:'cloud',
    sub: j.sub || '',                      // 用户唯一 id（RLS 的 owner 依据）
    realName: (Auth._users().find(x=>x.account===account)||{}).realName || ''
  }));
  return {ok:true, user:{account, realName:Auth.realName()}};
}

/* ---- 账号诊断：用给定账号密码实测云端，告诉用户到底哪一步不对 ----
   背景：CloudBase 对「账号不存在」和「密码错误」返回同一个错误码（4043），
   前端无法区分。所以这里做的是「把能确定的都测出来」：
     1. 环境 ID 能不能连通（是不是域名/网络问题）
     2. 认证接口是否可达（是不是接口没开通）
     3. 账号密码能否换取令牌
     4. 若能换令牌，再把返回的 sub 显示出来（用于核对 RLS 归属）
   注意：本函数不会把令牌写进登录态，纯诊断用。 */
async function cloudProbeAccount(account, password){
  const env = (S.settings&&S.settings.envId||'').trim();
  const out = {steps:[]};
  const push=(name,ok,detail)=>{ out.steps.push({name,ok,detail}); };

  /* 第 1 步：环境 ID */
  if(!env){
    push('环境 ID', false, '未填写');
    out.ok=false; out.verdict='请先在「云端设置」填写环境 ID';
    return out;
  }
  if(!/^[a-z0-9-]+$/i.test(env)){
    push('环境 ID', false, '格式可疑：'+env);
  }else{
    push('环境 ID', true, env);
  }

  const base = `https://${env}.api.tcloudbasegateway.com`;

  /* 第 2 步：认证接口可达性（用一个空请求，只看它是否回应） */
  try{
    const t=Date.now();
    const r = await fetch(base+'/auth/v1/signin', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-device-id':'probe'},
      body: JSON.stringify({username:'__probe__', password:'__probe__'})
    });
    const body = await r.text();
    let j={}; try{ j=JSON.parse(body); }catch(e){}
    const reachable = r.status>0 && !/GET|404|NOT_FOUND/i.test(String(j.code||''));
    push('认证接口', reachable, `HTTP ${r.status} · ${Date.now()-t}ms`);
    if(!reachable){
      out.ok=false;
      out.verdict='认证接口不可达（返回 '+(j.code||r.status)+'）。请确认该环境已开通「身份认证」。';
      return out;
    }
  }catch(e){
    push('认证接口', false, '网络错误：'+(e.message||''));
    out.ok=false;
    out.verdict='网络连不上 CloudBase。检查网络、代理，或环境 ID 是否写错。';
    return out;
  }

  /* 第 3 步：账号密码 */
  if(!account || !password){
    push('账号密码', false, '有空值');
    out.ok=false; out.verdict='请把账号和密码都填上再测';
    return out;
  }

  try{
    const r = await fetch(base+'/auth/v1/signin', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-device-id':'probe'},
      body: JSON.stringify({username:account, password})
    });
    const body = await r.text();
    let j={}; try{ j=JSON.parse(body); }catch(e){}

    if(r.ok && j.access_token){
      push('账号密码', true, '登录成功');
      if(j.sub) push('用户 sub', true, j.sub);
      /* 顺便探一下三张表（用这个临时令牌，不写进登录态） */
      for(const t of ['schedules','patients','images']){
        try{
          const rr = await fetch(`${base}/v1/rdb/rest/${t}?select=id&limit=1`, {
            headers:{'Authorization':'Bearer '+j.access_token}
          });
          push('表 '+t, rr.ok, rr.ok? '可读' : 'HTTP '+rr.status);
        }catch(e){ push('表 '+t, false, '网络错误'); }
      }
      out.ok=true;
      out.verdict='账号密码正确，云端一切正常。可以正常登录。';
    }else{
      const code = j.error_code;
      const name = String(j.code||'');
      if(code===4043 || name==='INVALID_USERNAME_OR_PASSWORD'){
        push('账号密码', false, '云端拒绝（error_code 4043）');
        out.ok=false;
        out.verdict =
          '账号「'+account+'」或密码不对。\n'+
          '⚠ CloudBase 对「账号不存在」和「密码错误」返回同一个错误码 4043，无法区分，请逐项核对：\n'+
          '  ① 到控制台「身份认证 → 用户管理」看有没有「'+account+'」这个用户；\n'+
          '     注意：要「用户名/密码」类型的用户，不是手机号或邮箱类型的。\n'+
          '  ② 账号名区分大小写，且不能有前后空格。\n'+
          '  ③ 如果第①步看到账号确实存在，就在那一条上「重置密码」重设一次，再用新密码登录。\n'+
          '  ④ 密码长度建议 6 位以上；若控制台建号时设的就是 123456，应能用。';
      }else if(name==='INVALID_ARGUMENT' || code===3){
        push('账号密码', false, '参数为空或格式不对');
        out.ok=false; out.verdict='账号或密码为空，或账号格式不合法（2-48位，字母/数字/-_.:+@，不以符号开头）';
      }else{
        push('账号密码', false, 'HTTP '+r.status+' · '+(name||'未知错误'));
        out.ok=false;
        out.verdict='云端返回未知错误（HTTP '+r.status+' · '+(name||code||'')+'）。'+
                    (j.error_description? '\n详情：'+j.error_description : '');
      }
    }
  }catch(e){
    push('账号密码', false, '网络错误：'+(e.message||''));
    out.ok=false; out.verdict='测试过程中网络中断，请检查网络后重试。';
  }
  return out;
}

/* ---- 注册：CloudBase 不支持纯账号密码注册，引导去控制台创建 ---- */
async function cloudRegister(account, password){
  return {ok:false, fallback:false,
    msg:'云端账号需在「云开发控制台 → 身份认证 → 用户管理」中创建（支持账号密码）。创建后回到这里登录即可。'};
}

/* =========================================================================
   2.2 离线补传队列（Outbox）
   -------------------------------------------------------------------------
   断网时云端写入会失败。此时数据已经存进本机，但云端还是旧值。
   这里把「失败的写操作」记下来，等网络恢复后自动重放到 CloudBase。

   设计要点：
     · 按 store+id 去重合并 —— 同一条记录离线改 10 次，只保留最后一次，
       避免恢复网络后发几十个冗余请求。
     · flush 加互斥锁 —— 防止 online 事件和手动「立即同步」并发导致重复提交。
     · 队列持久化在 localStorage —— 关掉浏览器再打开也不会丢。
   ========================================================================= */
const Outbox = {
  _key:'wb_outbox',
  _flushing:false,
  _lastResult:null,          // {at, ok, fail} 供设置页展示

  list(){
    try{
      const a=JSON.parse(localStorage.getItem(this._key)||'[]');
      return Array.isArray(a)?a:[];
    }catch(e){ return []; }
  },
  _write(arr){
    try{ localStorage.setItem(this._key, JSON.stringify(arr.slice(-300))); }catch(e){}
  },
  count(){ return this.list().length; },

  /* op = {store:'patients'|'images'|'schedules', id, kind:'put'|'del'} */
  add(store, id, kind){
    const arr=this.list();
    const hit=arr.find(x=>x.store===store && x.id===String(id));
    if(hit){                        // 同一条记录：后一次操作覆盖前一次
      hit.kind=kind; hit.ts=Date.now();
      /* 新记录一次都没成功上传过，直接删掉即可，不必再补传 */
      if(kind==='put') hit.never=(hit.never!==false);
    }else{
      arr.push({store, id:String(id), kind, ts:Date.now(), never:(kind==='put')});
    }
    this._write(arr);
    this.refreshUI();
  },

  clear(){ this._write([]); this.refreshUI(); },

  /* 把队列里的操作重放到云端。串行执行，任一失败即停止（下次再试）。 */
  async flush(opts){
    opts=opts||{};
    if(this._flushing) return {ok:false, busy:true};
    if(!CLOUD_ON()) return {ok:false, nocloud:true};
    if(!navigator.onLine){ if(!opts.silent) toast('当前离线，等联网后会自动同步'); return {ok:false, offline:true}; }

    const arr=this.list();
    if(!arr.length) return {ok:true, done:0};

    this._flushing=true;
    let done=0, failed=0;
    try{
      /* 按表聚合，尽量用批量写入而不是逐条请求 */
      const byStore={};
      arr.forEach(op=>{ (byStore[op.store]=byStore[op.store]||[]).push(op); });

      for(const store of Object.keys(byStore)){
        const ops=byStore[store];
        try{
          if(store==='schedules'){
            /* 排班整表按「本账号+本人姓名」重写，无需逐条处理 */
            await cloudSave('schedules');
          }else{
            /* 病人/影像：走整表替换，直接反映本机当前状态 */
            await cloudSave(store);
          }
          /* 整表成功 → 该表所有待办一次性清掉 */
          this._write(this.list().filter(o=>o.store!==store));
          done+=ops.length;
        }catch(e){
          failed+=ops.length;
          console.warn('[outbox] '+store+' 补传失败：', e && e.message);
        }
      }
    }finally{
      this._flushing=false;
      this._lastResult={at:Date.now(), ok:done, fail:failed};
      this.refreshUI();
    }
    if(failed && !opts.silent) toast('仍有 '+failed+' 项待同步，稍后自动重试');
    else if(done && !opts.silent) toast('已同步 '+done+' 项到云端');
    return {ok:!failed, done, failed};
  },

  /* 刷新设置页里显示的状态（元素不存在时静默跳过） */
  refreshUI(){
    const n=this.count();
    const el=$('#outboxState');
    if(el){
      el.innerHTML = n
        ? '<b style="color:var(--warn)">待同步 '+n+' 条</b>　（联网后会自动补传）'
        : '所有数据已同步';
      el.style.display='';
    }
    const btn=$('#setSyncNow');
    if(btn) btn.disabled = !n || !navigator.onLine;
    const badge=$('#outboxBadge');
    if(badge){ badge.textContent=n>99?'99+':String(n); badge.style.display = n?'inline-block':'none'; }
  }
};

/* ---- 数据映射 --------------------------------------------------------------
   CloudBase 三张表（字段与你在控制台里建好的结构完全一致，不要随意改名）：
     schedules(owner_id, id, work_date, doctor, shift, uploader, created_at)
        work_date 日期 / doctor 医生姓名 / shift 班次 / uploader 上传者登录账号名
        一行 = 某医生某天的班次。各位同事各自上传自己的排班，
        读取时按日期合并成 S.bigSchedule = { 'YYYY-MM-DD': { 医生名: '班次' } }，
        大排班即所有人合并后的结果。
     patients(owner_id, id, name, phone, gender, age, teeth, note, creator, created_at)
        teeth 在前端是结构体（牙位数组等），统一 JSON.stringify 后存进该列。
     images(owner_id, id, patient_name, category, file_url, description, creator, created_at)
        file_url 存图片的 dataURL（无需额外对象存储）。

   ⚠ owner_id 不在这三张表的「业务字段」里，但必须有：
     它是行级权限（RLS）的判断依据，由数据库 DEFAULT auth.uid() 自动填，
     前端【绝对不要】传 owner_id，否则会与策略冲突。
   --------------------------------------------------------------------------- */
function cloudAccount(){ return (Auth.current()||{}).account || ''; }
/* 当前登录账号名（写入 uploader / creator 用） */
function cloudUser(){ return cloudAccount(); }

/* ---------- patients：业务对象 ⇄ 数据行 互转 ----------
   前端内存里的病人对象形状：
     { id, name, phone, gender, age, note, tags:[], charts:[{id,type,teeth:[],desc,words}], createdAt }
   而表里 teeth 是一个文本列 —— 我们把「charts + tags」一起打包成 JSON 存进去，
   这样既严格使用你建好的列名，又不用为牙位图和标记额外加列。 */
function patientToRow(p, acc){
  /* teeth 列：优先用显式 teeth，否则把 charts/tags 打包存进去（不丢数据） */
  let teeth = '';
  if(p.teeth){ teeth = (typeof p.teeth==='string') ? p.teeth : JSON.stringify(p.teeth); }
  else if((p.charts && p.charts.length) || (p.tags && p.tags.length)){
    teeth = JSON.stringify({ v:1, charts:p.charts||[], tags:p.tags||[] });
  }
  return {
    id:        String(p.id),
    name:      p.name  || '',
    phone:     p.phone || '',
    gender:    p.gender|| '',
    age:       p.age==null ? '' : String(p.age),
    teeth:     teeth,
    note:      p.note  || '',
    creator:   p.creator || acc || '',
    created_at:p.createdAt ? new Date(p.createdAt).toISOString() : new Date().toISOString()
  };
}
function rowToPatient(rw){
  if(!rw) return null;
  let charts=[], tags=[], teethText='';
  const raw = rw.teeth;
  if(typeof raw==='string' && raw){
    try{
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed==='object' && !Array.isArray(parsed) && parsed.v===1){
        /* 我们自己的打包格式 */
        charts = parsed.charts || [];
        tags   = parsed.tags   || [];
      }else if(Array.isArray(parsed)){
        /* 直接是 charts 数组 */
        charts = parsed;
      }else{
        teethText = String(parsed);
      }
    }catch(e){ teethText = raw; }        /* 普通文本，原样留着 */
  }
  return {
    id: rw.id, name: rw.name||'', phone: rw.phone||'', gender: rw.gender||'',
    age: rw.age||'', note: rw.note||'', teeth: teethText,
    charts: charts, tags: tags,
    creator: rw.creator||'',
    createdAt: rw.created_at ? Date.parse(rw.created_at)||Date.now() : Date.now()
  };
}

/* ---------- images：业务对象 ⇄ 数据行 互转 ----------
   前端内存里的影像对象形状：
     { id, name(文件名/标题), category(分类), data(dataURL), desc(描述), patientId, createdAt }
   表结构： id, patient_name, category, file_url, description, creator, created_at
     · file_url     ← data（图片 dataURL）
     · patient_name ← 由 patientId 反查病人姓名（表里存姓名，更直观）
     · description  ← desc；标题 name 一并带上，避免丢信息 */
function imageToRow(im, acc){
  /* patientId → 病人姓名；反查不到就保留对象里已有的姓名 */
  let pname = im.patientName || '';
  if(!pname && im.patientId){
    const p = (S.patients||[]).find(x=>x.id===im.patientId);
    if(p) pname = p.name || '';
  }
  /* 标题与描述合并成 description：标题在前，用「 · 」分隔，回读时能拆回来 */
  const title = im.name || '';
  const desc  = im.desc || '';
  return {
    id:           String(im.id),
    patient_name: pname,
    category:     im.category || '',
    /* 图片本体（dataURL）存这里 */
    file_url:     im.data || '',
    description:  (title && desc) ? (title+' · '+desc) : (title || desc),
    creator:      im.creator || acc || '',
    created_at:   im.createdAt ? new Date(im.createdAt).toISOString() : new Date().toISOString()
  };
}
function rowToImage(rw){
  if(!rw) return null;
  const description = rw.description || '';
  /* 还原「标题 · 说明」拆成 name / desc 两个字段 */
  let name='', desc=description;
  const k = description.indexOf(' · ');
  if(k > 0){ name = description.slice(0,k); desc = description.slice(k+3); }
  /* patient_name → patientId（能在档案里匹配上就建立关联） */
  const p = rw.patient_name ? (S.patients||[]).find(x=>x.name===rw.patient_name) : null;
  return {
    id: rw.id, name: name, category: rw.category||'',
    data: rw.file_url||'', desc: desc,
    patientId: p ? p.id : '', patientName: rw.patient_name||'',
    creator: rw.creator||'',
    createdAt: rw.created_at ? Date.parse(rw.created_at)||Date.now() : Date.now()
  };
}

async function cloudLoad(){
  const acc = cloudAccount();
  const out = {patients:[], appts:[], images:[], stock:[], reminders:[], items:[],
               imgcats:[], words:[], rosters:[], schedule:{xy:{}, big:{}}};

  /* 1) 排班：拉全表（含所有账号的行），按日期 + 医生 合并
        —— 这就是「各自上传、大排班合并显示」的实现处。 */
  const schedRows = await CB.select('schedules',
    'select=id,doctor,work_date,shift,uploader&limit=20000');
  const big = {};
  const peopleSet = new Set();
  schedRows.forEach(rw=>{
    if(!rw || !rw.work_date || !rw.doctor) return;
    /* work_date 可能带时间部分（如 2026-06-01T00:00:00），统一截成 YYYY-MM-DD */
    const d = String(rw.work_date).slice(0,10);
    big[d] = big[d] || {};
    big[d][rw.doctor] = rw.shift || '';
    peopleSet.add(rw.doctor);
  });
  out.schedule.big = big;
  out.rosters = peopleSet.size ? [{ id:'cloud-roster', name:'云端排班',
    people:Array.from(peopleSet), dates:Object.keys(big).length, createdAt:Date.now() }] : [];

  /* 2) 病人 / 影像：只取自己的（RLS 还会再兜一层，双保险）
       注意顺序：先把病人写进 S.patients，影像才能按 patient_name 反查出 patientId */
  const pRows = await CB.select('patients',
    `select=id,name,phone,gender,age,teeth,note,creator,created_at&creator=eq.${encodeURIComponent(acc)}&limit=20000`);
  out.patients = pRows.map(rowToPatient).filter(Boolean);
  S.patients = out.patients;                       // 供 rowToImage 反查
  const iRows = await CB.select('images',
    `select=id,patient_name,category,file_url,description,creator,created_at&creator=eq.${encodeURIComponent(acc)}&limit=20000`);
  out.images = iRows.map(rowToImage).filter(Boolean);

  /* 3) 其余本地数据（预约、库存、提醒等）仍保留在本机，云端只同步这三张表 */
  await IDB.ready;
  for(const k of ['appts','stock','reminders','items','imgcats','words']){
    out[k] = await IDB.all(k);
  }
  const sch = await IDB.get('kv','schedule');
  out.schedule.xy = (sch && sch.value && sch.value.xy) || {};
  const st = await IDB.get('kv','settings');
  out.settings = (st && st.value) || null;
  return out;
}

async function cloudSave(kind){
  const acc = cloudAccount();
  const kinds = kind ? [kind] : ['patients','images','schedules'];
  for(const k of kinds){
    if(k==='schedules'){ await cloudSaveSchedules(acc); continue; }
    if(k!=='patients' && k!=='images') continue;     // 其它数据仍只存本机
    const mem = S[k]||[];
    const rows = (k==='patients')
      ? mem.map(o=>patientToRow(o, acc))
      : mem.map(o=>imageToRow(o, acc));
    await cloudReplaceTable(k, rows, acc);
  }
}

/* 排班：把「本账号上传的行」整体重写一遍（先删自己的旧行，再批量插入）。
   每个账号只写自己的部分，其它账号的行不动，从而实现多人累加合并。
   doctor 存医生姓名（用于大排班合并显示），uploader 存登录账号名（用于区分谁传的）。 */
async function cloudSaveSchedules(acc){
  const me = (S.me || Auth.realName() || '').trim();
  const doctor = me || acc;                 // 没填真实姓名时用账号名占位
  const rows = [];
  const big = S.bigSchedule || {};
  Object.keys(big).forEach(date=>{
    const shift = (big[date]||{})[doctor];
    if(shift!=null && shift!==''){
      rows.push({ work_date:date, doctor, shift, uploader:acc });
    }
  });
  /* 先删除本账号在本表的旧记录（只删 uploader = 自己 的行，不影响别人） */
  await CB.req('DELETE',
    `/v1/rdb/rest/schedules?uploader=eq.${encodeURIComponent(acc)}`,
    {retry:true});
  if(rows.length){
    await CB.req('POST', '/v1/rdb/rest/schedules',
      {body:rows, headers:{Prefer:'return=minimal'}, raw:true});
  }
}

/* 整表替换：删掉本账号旧行后批量插入新行（patients / images） */
async function cloudReplaceTable(table, rows, acc){
  await CB.req('DELETE', `/v1/rdb/rest/${table}?creator=eq.${encodeURIComponent(acc)}`, {retry:true});
  if(!rows.length) return;
  /* 分批发，避免单次请求过大 */
  const CHUNK = 200;
  for(let i=0;i<rows.length;i+=CHUNK){
    await CB.req('POST', `/v1/rdb/rest/${table}`,
      {body:rows.slice(i,i+CHUNK), raw:true});
  }
}

/* 把真实姓名写入 users 表（辅助表；失败静默忽略，不影响主流程） */
async function cloudUpsertProfile(account, realName){
  await CB.req('POST', '/v1/rdb/rest/users',
    {body:{account, real_name:realName, created_at:new Date().toISOString()}, raw:true});
}

/* 清空云端登录令牌 */
function cloudClearToken(){ CB.clear(); }

/* 连接自检：验证环境可达 + 登录状态 + 三张表是否可读 */
async function cloudSelfTest(){
  const out = {tables:{}};
  const env = (S.settings&&S.settings.envId||'').trim();
  out.env = env;
  if(!env) { out.ok=false; out.msg='请先填写环境ID'; return out; }

  /* 没拿到令牌就没必要探表了，直接给出明确结论 */
  if(!CB.token){
    out.ok=false; out.needLogin=true;
    out.msg='尚未登录云端（没有 access_token）。请退出后用 CloudBase 控制台创建好的账号重新登录。';
    return out;
  }

  /* 逐表探测：任何一张有问题都能精确定位是哪张 */
  const probes = [
    ['schedules','select=id&limit=1'],
    ['patients', 'select=id&limit=1'],
    ['images',   'select=id&limit=1']
  ];
  const t0 = Date.now();
  for(const [t,q] of probes){
    try{ await CB.select(t,q); out.tables[t]=true; }
    catch(e){ out.tables[t]=false; out.firstErr = out.firstErr || (t+': '+(e&&e.message||'')); }
  }
  out.ms = Date.now()-t0;
  const bad = Object.keys(out.tables).filter(k=>!out.tables[k]);
  if(!bad.length){
    out.ok = true;
    out.msg = '连接成功：账号已登录，schedules / patients / images 三张表均可读。';
  }else{
    out.ok = false;
    out.msg = '环境可访问，但以下表读取失败：'+bad.join('、')+'。'+(out.firstErr||'');
  }
  return out;
}

async function hash(str){
  try{
    const b = new TextEncoder().encode('wb::'+str);
    const d = await crypto.subtle.digest('SHA-256', b);
    return Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,32);
  }catch(e){ return 'plain:'+str; }
}

/* =========================================================================
   3. 全局状态
   ========================================================================= */
const S = {
  view:'calendar', calMode:'me', calMonth:'2026-09', selDate: todayStr(),
  patients:[], appts:[], images:[], stock:[], reminders:[], items:[], imgcats:[], words:[],
  rosters:[],                             // 排班表（可多份，支持重复导入覆盖）
  schedule:{}, bigSchedule:{}, settings:{},
  imaging:{cat:'面照', patient:'', q:'', tagsOpen:false},
  stockView:{cat:'器械', q:''},
  patientQ:'', searchQ:'', gridRange:0,
  user:null, me:''                          // 当前登录账号 + 绑定的真实姓名
};
const DEFAULT_SETTINGS = {
  theme:'light', fontSize:15, fontColor:'', fontFamily:'system',
  alarmTime:'08:00', alarmSound:'beep', alarmVolume:0.7, hourHeight:74,
  navOrder:['calendar','imaging','alarm','stock','patients'],
  /* 时间轴拖拽模式：true=编辑模式（可长按拖动预约）/ false=浏览模式（完全禁止拖动，仅轻点打开） */
  editMode:true,
  /* CloudBase 云端同步：默认关闭 = 纯离线单机版。
     打开且 envId 非空时，CLOUD_ON() 为真，Auth / Data 自动改走云端。
     ⚠ 这里只需要环境ID —— 出于安全，前端绝不保存 SecretId / SecretKey。 */
  cloudSync:false, envId:'',
  ocrUrl:'', ocrKey:''
};
/* ---- 设置的读写 ----
   ⚠ 这里曾经踩过一个坑：saveSettings() 调 IDB.put(...) 没有 await，
   是「发出去就不管」。而 loadSettings() 优先读 IDB ——
   于是退出登录后重新进入应用时，若那次异步写还没落盘，
   就会读到旧设置（cloudSync:false / envId:''），CLOUD_ON() 变 false，
   登录便静默退回本地模式，表现为「退出后再也连不上云端」。
   现在：写入 await，读取时两处来源互相兜底，杜绝竞态。 */
async function loadSettings(){
  let fromIdb=null, fromLs=null;
  try{ const r=await IDB.get('kv','settings'); fromIdb=r&&r.value; }catch(e){}
  try{ fromLs=JSON.parse(localStorage.getItem('wb_settings')||'null'); }catch(e){}
  /* 两份都存在时，取「字段更全」的那份：环境ID 或开关为真的一侧优先 */
  let s = fromIdb || fromLs || null;
  if(fromIdb && fromLs){
    const score = o => (!o ? -1 : ((o.envId?2:0) + (o.cloudSync?1:0)));
    if(score(fromLs) > score(fromIdb)) s = fromLs;
  }
  S.settings = Object.assign({}, DEFAULT_SETTINGS, s||{});
  if(!Array.isArray(S.settings.navOrder)) S.settings.navOrder = DEFAULT_SETTINGS.navOrder.slice();
  HOUR_H = S.settings.hourHeight||74;
}
/* 保存设置：必须等到真正落盘（两处都写，互为备份） */
async function saveSettings(){
  try{ await IDB.put('kv',{key:'settings',value:S.settings}); }catch(e){}
  try{ localStorage.setItem('wb_settings',JSON.stringify(S.settings)); }catch(e){}
  applySettings();
}
function applySettings(){
  const st=S.settings;
  HOUR_H = st.hourHeight||74;
  document.documentElement.setAttribute('data-theme', st.theme||'light');
  document.documentElement.style.setProperty('--fs',(st.fontSize||15)+'px');
  document.documentElement.style.setProperty('--hour-h',HOUR_H+'px');
  if(st.fontColor) document.documentElement.style.setProperty('--text',st.fontColor);
  else document.documentElement.style.removeProperty('--text');
  const fams={
    system:'-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif',
    hei:'"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif',
    song:'"Songti SC","SimSun","Noto Serif CJK SC",serif',
    kai:'"Kaiti SC","KaiTi","STKaiti",serif',
    yuan:'"Yuppy SC","Hiragino Maru Gothic ProN","PingFang SC",sans-serif'};
  document.documentElement.style.setProperty('--ff', fams[st.fontFamily]||fams.system);
  const tc = st.theme==='dark'?'#6FBBAE':(st.theme==='green'?'#4FA57A':(st.theme==='blue'?'#6B9BD1':'#5BA89B'));
  const m=$('meta[name=theme-color]'); if(m) m.setAttribute('content',tc);
}

   4. 登录页

function refreshLoginTip(){
  const tip = $('#lgTip') || document.querySelector('.login-tip');
  if(!tip) return;
  if(API_MODE()==='remote'){
    const env=(S.settings&&S.settings.envId)||'';
    tip.innerHTML = '☁ 已连接 CloudBase 云端（'+esc(env)+'）。<br>'+
      '登录将向 CloudBase 校验账号密码并获取令牌，账号需先在「云开发控制台 → 身份认证 → 用户管理」中创建。';
  }else{
    /* 注意：不要写成"单机版"就完事——用户会以为自己该用本地账号。
       这里明确区分「没配云端」和「配了但令牌失效」两种情况。 */
    tip.innerHTML = '⚠ 尚未配置云端：账号与数据仅存本机。<br>'+
      '展开下方「云端设置」填入环境 ID 即可启用云端同步。';
  }
  /* 同步更新云端设置区的状态文案 */
  const stEl=$('#lgCloudState');
  if(stEl) stEl.textContent = API_MODE()==='remote' ? '云端设置（已连接）' : '云端设置（未连接）';
  const inp=$('#lgEnvId');
  if(inp && !inp.value) inp.value = (S.settings&&S.settings.envId)||'';
}
/* 登录页的云端配置：保存环境ID + 开关，并尝试恢复令牌 */
function initLoginCloud(){
  const toggle=$('#lgCloudToggle'), body=$('#lgCloudBody'), arrow=$('#lgCloudArrow');
  if(toggle && body){
    toggle.onclick=()=>{
      const open = body.style.display==='none';
      body.style.display = open ? '' : 'none';
      if(arrow) arrow.textContent = open ? '▴' : '▾';
    };
  }
  const msg = t => { const m=$('#lgCloudMsg'); if(m) m.innerHTML=t; };

  const saveBtn=$('#lgCloudSave');
  if(saveBtn) saveBtn.onclick=async()=>{
    const v=($('#lgEnvId')?$('#lgEnvId').value.trim():'');
    if(!v){ msg('<span style="color:var(--danger)">请先填写环境ID</span>'); return; }
    S.settings.envId = v;
    S.settings.cloudSync = true;      // 填了环境ID就视为启用云端
    await saveSettings();             // ⚠ 必须等落盘，否则后续 CLOUD_ON() 可能读到旧值
    refreshLoginTip();
    msg('<span style="color:var(--ok)">✅ 已保存环境ID</span>，正在测试连接…');
    const r = await cloudSelfTest();
    if(r.ok) msg('<span style="color:var(--ok)">✅ 云端已就绪</span>，请用 CloudBase 控制台创建好的账号登录。');
    else if(r.needLogin) msg('<span style="color:var(--ok)">✅ 环境ID已保存</span>，'+
      '<span style="color:var(--warn)">接下来请用账号密码登录</span>以获取令牌。');
    else msg('<span style="color:var(--danger)">❌ 环境ID已保存，但连接失败：</span>'+esc(r.msg||''));
  };

  const testBtn=$('#lgCloudTest');
  if(testBtn) testBtn.onclick=async()=>{
    const v=($('#lgEnvId')?$('#lgEnvId').value.trim():'');
    if(v){ S.settings.envId=v; S.settings.cloudSync=true; await saveSettings(); refreshLoginTip(); }
    msg('正在测试…');
    const r = await cloudSelfTest();
    if(r.ok) msg('<span style="color:var(--ok)">✅ 连接成功</span>，账号已登录，三张表可读。');
    else if(r.needLogin) msg('<span style="color:var(--warn)">⚠ 环境可达，但尚未登录</span>，请输入账号密码登录。');
    else msg('<span style="color:var(--danger)">❌ 连接失败：</span>'+esc(r.msg||''));
  };

  /* ---- 账号诊断：登录报错时点它，逐步定位问题 ----
     会依次检查：环境ID格式 → 认证接口可达性 → 账号密码 → 三张表权限，
     并把 CloudBase 的原始错误码显示出来，避免只看到一句笼统的"密码不正确"。 */
  const probeBtn=$('#lgProbe');
  if(probeBtn) probeBtn.onclick=async()=>{
    const out=$('#lgProbeOut');
    const v=($('#lgEnvId')?$('#lgEnvId').value.trim():'');
    if(v){ S.settings.envId=v; S.settings.cloudSync=true; await saveSettings(); refreshLoginTip(); }
    const account=$('#lgUser')?$('#lgUser').value.trim():'';
    const password=$('#lgPass')?$('#lgPass').value:'';

    if(out){ out.style.display=''; out.innerHTML='<span style="color:var(--muted)">正在诊断…</span>'; }
    probeBtn.disabled=true;
    let r;
    try{ r = await cloudProbeAccount(account, password); }
    catch(e){ r = {ok:false, steps:[], verdict:'诊断异常：'+(e&&e.message||'')}; }
    probeBtn.disabled=false;

    if(!out) return;
    let h='<div style="border-top:1px dashed var(--line);padding-top:8px;margin-top:4px">';
    h+='<b>诊断结果</b><br>';
    (r.steps||[]).forEach(s=>{
      h += (s.ok?'<span style="color:var(--ok)">✓</span> ':'<span style="color:var(--danger)">✗</span> ')
         + esc(s.name) + (s.detail? ' <span style="color:var(--muted)">· '+esc(s.detail)+'</span>' : '') + '<br>';
    });
    h+='<div style="margin-top:6px;padding:8px;border-radius:8px;background:'+
       (r.ok?'rgba(46,160,120,.10)':'rgba(220,90,90,.10)')+'">'
       + esc(r.verdict||'').replace(/\n/g,'<br>') + '</div>';
    h+='</div>';
    out.innerHTML=h;
  };
}
function initLogin(){
  refreshLoginTip();
  updateLoginInstall();
  initLoginCloud();
  const run = async (mode)=>{
    const account = $('#lgUser').value.trim();
    const password = $('#lgPass').value;
    const msg = (t,color)=>{ const m=$('#lgMsg');
      m.textContent = t; m.style.color = color||''; };
    msg('');
    if(!account){ msg('请输入账号'); return; }
    if(!password){ msg('请输入密码'); return; }
    /* 登录中：禁用按钮，避免重复提交造成多次令牌请求 */
    const btn = mode==='reg' ? $('#rgBtn') : $('#lgBtn');
    const old = btn.textContent;
    btn.disabled = true; btn.textContent = '登录中…';
    let r;
    try{
      r = mode==='reg' ? await Auth.register(account,password)
                       : await Auth.login(account,password);
    }catch(e){
      r = {ok:false, msg:'登录出错：'+((e&&e.message)||'未知错误')};
    }finally{
      btn.disabled = false; btn.textContent = old;
    }
    if(!r.ok){
      /* 明确的失败提示（尤其是「账号在 CloudBase 不存在」这种） */
      msg(r.msg||'登录失败', 'var(--danger)');
      refreshLoginTip();
      return;
    }
    enterApp(r.user);
  };
  $('#lgBtn').onclick = ()=>run('login');
  $('#rgBtn').onclick = ()=>run('reg');
  $('#lgPass').onkeydown = e=>{ if(e.key==='Enter') run('login'); };
  $('#lgUser').onkeydown = e=>{ if(e.key==='Enter') $('#lgPass').focus(); };
}
function enterApp(user){
  S.user = user;
  S.me = (user && user.realName) || Auth.realName() || '';
  $('#loginScreen').classList.add('hide');
  try{ if(window.__ac) window.__ac.resume(); }catch(e){}
  bootApp();
  /* 进入应用后：若在线且开着云端，把上次没传上去的改动补一次 */
  setTimeout(()=>{ try{ if(CLOUD_ON() && navigator.onLine) Outbox.flush({silent:true}); }catch(e){} }, 1500);
}
/* 退出登录：不依赖整页刷新，直接在应用内切回登录页，保证任何环境都可靠生效。
   ⚠ 必须把「令牌 + 刷新令牌 + 会话记录」全部清干净，
   否则重新登录时可能带着旧令牌/旧会话，出现「退不干净、登不上」的假象。 */
function logout(){
  Auth.logout();                       // 清 CB._tok + wb_cb_refresh + wb_session
  // 清掉内存中的登录态，避免同页切换账号时串号
  S.user = null; S.me = '';
  S.patients = []; S.images = [];      // 清掉上一位用户的数据，避免串号显示
  S.bigSchedule = {}; S.rosters = [];
  // 关闭可能打开的侧边栏 / 弹窗，避免遮罩残留
  try{ closeSheet(); }catch(e){}
  try{ closeSidebar(); }catch(e){}
  // 显示登录页并重置表单
  const ls = $('#loginScreen'); if(ls) ls.classList.remove('hide');
  const u = $('#lgUser'), p = $('#lgPass'), m = $('#lgMsg');
  if(u) u.value=''; if(p) p.value=''; if(m){ m.textContent=''; m.style.color=''; }
  // 云端设置区同步回「未连接」状态，并保留环境ID方便下次登录
  refreshLoginTip();
  try{ window.__booted = false; }catch(e){}   // 允许下一位用户重新初始化
  toast('已退出登录');
}

/* ---- 边缘滑动手势 ---- */
function initEdgeGesture(){
  const edge=$('#edge'), scrim=$('#scrim'), sb=$('#sidebar');
  let startX=0, startY=0, tracking=false, from=0, dragging=false;
  const setX = px => { sb.style.transform = 'translateX('+px+'px)'; };

  edge.addEventListener('touchstart', e=>{
    if(isDesktop()) return;
    const t=e.touches[0]; startX=t.clientX; startY=t.clientY; tracking=true; dragging=false;
    $('#app').classList.add('sb-dragging');
  }, {passive:true});
  edge.addEventListener('touchmove', e=>{
    if(!tracking||isDesktop()) return;
    const t=e.touches[0], dx=t.clientX-startX, dy=t.clientY-startY;
    if(Math.abs(dy)>Math.abs(dx) && !dragging) { tracking=false; return; }
    if(dx>6) dragging=true;
    if(dragging){ e.preventDefault(); setX(Math.min(0, -sb.offsetWidth + dx)); }
  }, {passive:false});
  edge.addEventListener('touchend', e=>{
    if(!tracking) return;
    tracking=false; dragging=false;
    $('#app').classList.remove('sb-dragging'); sb.style.transform='';
    const t=e.changedTouches[0];
    if(t.clientX-startX > 42) openSidebar();
  });

  // 打开状态下：向左滑动关闭（侧边栏或遮罩上）
  const closeDrag = el=>{
    let sx=0, sy=0, on=false;
    el.addEventListener('touchstart', e=>{
      if(isDesktop() || !$('#app').classList.contains('sb-open')) return;
      sx=e.touches[0].clientX; sy=e.touches[0].clientY; on=true;
      $('#app').classList.add('sb-dragging');
    }, {passive:true});
    el.addEventListener('touchmove', e=>{
      if(!on||isDesktop()) return;
      const t=e.touches[0], dx=t.clientX-sx;
      if(Math.abs(t.clientY-sy)>Math.abs(dx)) { on=false; return; }
      if(dx<-6){ e.preventDefault(); setX(Math.max(-sb.offsetWidth, dx)); }
    }, {passive:false});
    el.addEventListener('touchend', e=>{
      if(!on) return; on=false;
      $('#app').classList.remove('sb-dragging'); sb.style.transform='';
      if(e.changedTouches[0].clientX-sx < -42) closeSidebar();
    });
  };
  closeDrag(scrim); closeDrag(sb);
  scrim.addEventListener('click', ()=>closeSidebar());
  window.addEventListener('resize', ()=>{ renderSidebar(); });
}

/* ---- 长按拖动排序（像手机桌面移动 App）---- */
function bindDragSort(el){
  let timer=null, ghost=null, startY=0, startX=0, active=false, moved=false;
  const onDown = e=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    startY=e.clientY; startX=e.clientX; moved=false;
    clearTimeout(timer);
    timer=setTimeout(()=>{
      active=true;
      try{ navigator.vibrate && navigator.vibrate(15); }catch(err){}
      const r=el.getBoundingClientRect();
      ghost=el.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('active');
      ghost.style.width=r.width+'px'; ghost.style.height=r.height+'px';
      ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px';
      document.body.appendChild(ghost);
      el.classList.add('dragging');
      $('#app').classList.add('sb-dragging');
    }, 400);
  };
  const onMove = e=>{
    if(!active){
      if(Math.abs(e.clientY-startY)>8 || Math.abs(e.clientX-startX)>8){ clearTimeout(timer); }
      return;
    }
    moved=true;
    e.preventDefault();
    ghost.style.top = (e.clientY - (isDesktop()?21:28))+'px';
    const siblings = $$('#sbTop .nav').filter(n=>n!==el);
    const y = e.clientY;
    for(const s of siblings){
      const r=s.getBoundingClientRect();
      if(y > r.top && y < r.bottom){
        const mid=r.top+r.height/2;
        if(y<mid) s.parentNode.insertBefore(el, s);
        else s.parentNode.insertBefore(el, s.nextSibling);
        break;
      }
    }
  };
  const onUp = ()=>{
    clearTimeout(timer);
    if(!active) return;
    active=false;
    if(ghost) ghost.remove(); ghost=null;
    el.classList.remove('dragging');
    $('#app').classList.remove('sb-dragging');
    if(moved){
      S.settings.navOrder = $$('#sbTop .nav').map(n=>n.dataset.view);
      saveSettings();
      toast('顺序已保存');
    }
  };
  el.addEventListener('pointerdown', onDown);
  /* 必须绑在 window 上：手指/鼠标移出按钮范围后仍要收到 move 与 up */
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  _dragHandlers.push({m:onMove, u:onUp});
}

const VIEW_TITLE = {calendar:'日历', grid:'大排班', day:'当日排班', patients:'病人档案',
  imaging:'影像', alarm:'闹钟', stock:'仓库', settings:'设置', search:'搜索', entry:'预约录入'};
const TITLE_ICON = {calendar:'📅', grid:'📊', day:'🕐', patients:'🗂', imaging:'🖼',
  alarm:'⏰', stock:'📦', settings:'⚙', search:'🔍', entry:'📷'};
/* 顶层页面：返回键在这里无效（已经在最外层） */
const ROOT_VIEWS = ['calendar','patients','imaging','alarm','stock','settings','grid'];
let _navStack = [];                     // 导航栈
function go(view, opts){
  opts=opts||{};
  const from=S.view;
  if(!opts.replace && from && from!==view){
    // 同一页反复进出不重复入栈
    if(_navStack[_navStack.length-1]!==from) _navStack.push(from);
    if(_navStack.length>20) _navStack.shift();
  }
  if(opts.reset) _navStack=[];
  S.view=view;
  $$('.view').forEach(v=>v.classList.remove('active'));
  const el=$('#v-'+view); if(el) el.classList.add('active');
  $$('#sbTop .nav, .sb-bottom .nav').forEach(n=>n.classList.toggle('active', n.dataset.view===view));
  renderTop(); renderView(view);
  updateBackBtn();
  $('#content').scrollTop=0;
}
/* 是否还有上一级可返回 */
function canBack(){
  if(_entryOpen) return true;                       // 预约录入页
  if(_navStack.length) return true;
  return !ROOT_VIEWS.includes(S.view);
}
/* 返回上一级；没有上一级时回到主页面（不退出应用） */
function goBack(){
  if(_entryOpen){ closeEntry(); return; }           // 先关预览/照片入口
  if(_navStack.length){ const v=_navStack.pop(); go(v,{replace:true}); return; }
  if(S.view==='day'){ go('calendar',{replace:true}); return; }
  if(S.view==='search'){ go('calendar',{replace:true}); return; }
  /* 已经在最外层：回退到日历 */
  if(S.view!=='calendar'){ go('calendar',{replace:true}); }
}
function updateBackBtn(){
  const show=canBack()?1:0;

const _dp = { y:0, m:0, d:0, cb:null };
function openDatePicker(cur, cb, opts){
  opts=opts||{};
  const base = cur && /^\d{4}-\d{2}-\d{2}$/.test(cur) ? cur : todayStr();
  _dp.y = +base.slice(0,4); _dp.m = +base.slice(5,7); _dp.d = +base.slice(8,10); _dp.cb = cb;

  const yNow = new Date().getFullYear();
  const years=[]; for(let y=yNow-6; y<=yNow+4; y++) years.push(y);
  const daysIn = (y,m)=> new Date(y,m,0).getDate();

  const col = (name, items, sel, fmt) =>
    '<div class="dp-col" data-col="'+name+'"><div class="sp"></div>'+
    items.map(v=>'<div class="dp-item'+(v===sel?' on':'')+'" data-v="'+v+'">'+(fmt?fmt(v):v)+'</div>').join('')+
    '<div class="sp"></div></div>';

  const html =
    '<div class="dp-wrap" id="dpWrap">'+

function initFab(){
  const fab=$('#fabBack'); if(!fab) return;
  let dragging=false, moved=false, sx=0, sy=0, ox=0, oy=0, lp=null;
  const place=(x,y)=>{
    // 贴边吸附，避免挡住内容
    const w=fab.offsetWidth, h=fab.offsetHeight;
    const maxX=window.innerWidth-w-6, maxY=window.innerHeight-h-6;
    x=clamp(x,6,maxX); y=clamp(y,6,maxY);
    fab.style.left=x+'px'; fab.style.top=y+'px'; fab.style.bottom='auto';
    return {x,y};
  };
  const saved=S.settings.fabPos;
  if(saved && typeof saved.x==='number') requestAnimationFrame(()=>place(saved.x,saved.y));

  fab.addEventListener('pointerdown', e=>{
    dragging=false; moved=false;
    sx=e.clientX; sy=e.clientY;
    const r=fab.getBoundingClientRect(); ox=r.left; oy=r.top;
    lp=setTimeout(()=>{ dragging=true; fab.classList.add('dragging');
      try{ fab.setPointerCapture(e.pointerId); }catch(err){} },220);
    e.preventDefault();
  });
  window.addEventListener('pointermove', e=>{
    if(!dragging) {
      if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8) clearTimeout(lp);
      return;
    }
    moved=true;
    const r=fab.getBoundingClientRect();
    place(ox + (e.clientX-sx), oy + (e.clientY-sy));
  });
  window.addEventListener('pointerup', ()=>{
    clearTimeout(lp);
    if(dragging){
      dragging=false; fab.classList.remove('dragging');
      const r=fab.getBoundingClientRect();
      S.settings.fabPos={x:r.left, y:r.top}; saveSettings();
    }
  });
  window.addEventListener('pointercancel', ()=>{ clearTimeout(lp); dragging=false; fab.classList.remove('dragging'); });
  fab.addEventListener('click', e=>{
    if(moved){ moved=false; return; }
    goBack();
  });
  $('#tbBack').onclick=goBack;
}

/* =========================================================================
   7. Excel / CSV 离线解析（纯前端，不联网、不依赖任何库）
   ========================================================================= */
async function inflateRaw(u8){
  if(typeof DecompressionStream==='undefined') return null;
  const ds=new DecompressionStream('deflate-raw');
  const st=new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function readZip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let eocd=-1;
  for(let i=u8.length-22;i>=0 && i>u8.length-70000;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error('不是有效的 xlsx 文件');
  const count=dv.getUint16(eocd+10,true);
  let off=dv.getUint32(eocd+16,true);
  const files=[]; const td=new TextDecoder('utf-8');
  for(let i=0;i<count;i++){
    if(off+46>u8.length) break;
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true), csize=dv.getUint32(off+20,true);
    const nlen=dv.getUint16(off+28,true), elen=dv.getUint16(off+30,true), clen=dv.getUint16(off+32,true);
    const lho=dv.getUint32(off+42,true);
    const name=td.decode(u8.subarray(off+46,off+46+nlen));
    const lnlen=dv.getUint16(lho+26,true), lelen=dv.getUint16(lho+28,true);
    const start=lho+30+lnlen+lelen;
    files.push({name, method, data:u8.subarray(start,start+csize)});
    off += 46+nlen+elen+clen;
  }
  const out={};
  for(const f of files) out[f.name] = f.method===0 ? f.data : (await inflateRaw(f.data))||new Uint8Array();
  return out;
}
function colNum(ref){ let n=0; for(const ch of ref){ if(ch>='A'&&ch<='Z') n=n*26+(ch.charCodeAt(0)-64); else break; } return n-1; }
/* XML 实体解码：命名实体 + 十进制/十六进制数字字符引用。
   注意：部分 Excel（如 openpyxl 导出的 inlineStr）会把中文写成 &#26143; 这种
   数字实体，只替换 &amp; 之类会得到一串乱码，所以必须一起解码。 */
function xmlUnesc(s){
  if(s==null) return '';
  return String(s).replace(/&(#x?[0-9A-Fa-f]+|[a-z]+);/g, (m, code)=>{
    if(code[0]==='#'){
      const n = code[1]==='x'||code[1]==='X' ? parseInt(code.slice(2),16) : parseInt(code.slice(1),10);
      return isFinite(n) && n>=0 && n<=0x10FFFF ? String.fromCodePoint(n) : m;
    }
    const named={ lt:'<', gt:'>', amp:'&', quot:'"', apos:"'", nbsp:'\u00A0' };
    return named[code]!=null ? named[code] : m;
  });
}
function parseSheetXML(xml, shared){
  const rows=[]; const rowRe=/<row[^>]*>([\s\S]*?)<\/row>|<row[^>]*\/>/g; let rm;
  while((rm=rowRe.exec(xml))){
    const rowXml=rm[1]||''; const row=[];
    // 注意：先匹配自闭合 <c .../>，否则 "[^>]*" 会把结尾的 "/" 吃掉，
    // 导致 <c r="F3" s="2"/> 这种空单元格吞掉后面整个单元格（会把 H3 的值算到 F3 上）
    const cRe=/<c\b([^>]*?)\/>|<c\b([^>]*?)>([\s\S]*?)<\/c>/g; let cm;
    while((cm=cRe.exec(rowXml))){
      const attrs=cm[1]!=null?cm[1]:(cm[2]||''), inner=cm[3]||'';
      const r=(attrs.match(/r="([A-Z]+\d+)"/)||[])[1]||'';
      const t=(attrs.match(/t="([^"]+)"/)||[])[1]||'';
      let v=(inner.match(/<v>([\s\S]*?)<\/v>/)||[])[1]||'';
      if(t==='inlineStr') v=(inner.match(/<t[^>]*>([\s\S]*?)<\/t>/)||[])[1]||'';
      v=xmlUnesc(v);
      if(t==='s') v = shared[Number(v)]!=null ? shared[Number(v)] : v;
      row[r?colNum(r):row.length]=(v||'').trim();
    }
    rows.push(row);
  }
  return rows;
}
async function parseXlsx(file){
  const files=await readZip(await file.arrayBuffer());
  const td=new TextDecoder('utf-8');
  const ssName=Object.keys(files).find(n=>/xl\/sharedStrings\.xml$/i.test(n));
  let shared=[];
  if(ssName){
    const xml=td.decode(files[ssName]); const siRe=/<si>([\s\S]*?)<\/si>/g; let m;
    while((m=siRe.exec(xml))){
      // 一个 <si> 里可能有多个 <r><t>…</t></r>（富文本分段），需要拼接
      const txt=(m[1].match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[]).map(s=>s.replace(/<[^>]+>/g,'')).join('');
      shared.push(xmlUnesc(txt));
    }
  }
  const sheetName=Object.keys(files).find(n=>/xl\/worksheets\/sheet1\.xml$/i.test(n))
    || Object.keys(files).find(n=>/xl\/worksheets\/.*\.xml$/i.test(n));
  if(!sheetName) throw new Error('找不到工作表');
  return parseSheetXML(td.decode(files[sheetName]), shared);
}
function parseCsv(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      let txt='';
      try{ txt=new TextDecoder('utf-8').decode(new Uint8Array(r.result)); }catch(e){ txt=String(r.result); }
      if((txt.match(/\uFFFD/g)||[]).length>2){
        try{ const g=new TextDecoder('gbk').decode(new Uint8Array(r.result));
          if(!(g.match(/\uFFFD/g)||[]).length) txt=g; }catch(e){}
      }
      txt=txt.replace(/^\uFEFF/,'');
      const lines=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='');
      if(!lines.length) return res([]);
      const sep = lines[0].split('\t').length>2 ? '\t' : (lines[0].indexOf(',')>=0?',':'\t');
      res(lines.map(l=>{
        const out=[]; let cur='', q=false;
        for(let i=0;i<l.length;i++){
          const c=l[i];
          if(c==='"'){ if(q&&l[i+1]==='"'){cur+='"';i++;} else q=!q; }
          else if(c===sep&&!q){ out.push(cur.trim()); cur=''; }
          else cur+=c;
        }
        out.push(cur.trim()); return out;
      }));
    };
    r.onerror=rej; r.readAsArrayBuffer(file);
  });
}
const toRows = file => /\.csv$|\.txt$/i.test(file.name||'') ? parseCsv(file) : parseXlsx(file);
function parseDateCell(v, yearHint){
  if(v==null) return null;
  let s=String(v).trim();
  if(!s) return null;
  // Excel 日期序列号（可能是 "46265" 或 "46265.0"，也可能是 5 位整数）
  const numStr=s.replace(/\.0+$/,'');
  if(/^\d{4,6}$/.test(numStr)){
    const n=Number(numStr);
    if(n>20000 && n<80000){                       // 1949 ~ 2119 之间
      const d=new Date(Date.UTC(1899,11,30)+n*86400000);
      return ymd(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
    }
  }
  s=s.replace(/[年月]/g,'-').replace(/日/g,'').replace(/\s+/g,'')
    .replace(/\//g,'-').replace(/\./g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
  let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1]+'-'+pad2(+m[2])+'-'+pad2(+m[3]);
  if((m=s.match(/^(\d{1,2})-(\d{1,2})$/))) return (yearHint||new Date().getFullYear())+'-'+pad2(+m[1])+'-'+pad2(+m[2]);
  if((m=s.match(/^(\d{1,2})-(\d{1,2})-(\d{1,2})$/))) return '20'+pad2(+m[1])+'-'+pad2(+m[2])+'-'+pad2(+m[3]);
  return null;
}
/* 班次归一化（严格版）：只认 叫/白/中/夜/休/体 及组合班。
   用途：「我的排班」只关心真实班次，认不出的内容一律当没排班。 */
function normShift(v){
  if(v==null) return '';
  const s=String(v).trim();
  if(!s) return '';
  const alias={'叫':'叫','叫班':'叫','白':'白','白班':'白','中':'中','中班':'中','夜':'夜','夜班':'夜',
    '休':'休','休息':'休','休班':'休','体':'体','体检':'体','体班':'体',
    '夜/体':'夜/体','体/夜':'体/夜','夜休':'夜/休','休夜':'休/夜'};
  if(alias[s]!=null) return alias[s];
  // 组合班：夜/体、体/夜、中/夜 …（保留原样，图表里按第一个班次上色）
  const combo=s.replace(/[／|]/g,'/').match(/^([叫白中夜休体])\s*\/\s*([叫白中夜休体])$/);
  if(combo) return combo[1]+'/'+combo[2];
  // 兜底：只认单字班次，忽略「班」「节假日」等噪音
  const one=s.replace(/\s/g,'').replace(/班/g,'');
  if(one.length===1 && SHIFTS.includes(one)) return one;
  return '';
}

/* -------------------------------------------------------------------------
   单元格归一化（宽松版，大排班专用）—— 原样保留一切非空内容
   -------------------------------------------------------------------------
   医院表格里格子可能是任何东西，绝不能因为「认不出」就丢掉：
     '体'           → '体'
     '明（洁+影）'   → '明（洁+影）'      ← 保留原文
     '临（洁+影）'   → '临（洁+影）'
     '/'  '／' 或 '—' → '/'               ← 占位符保留成 /
     '2'  '3'  '0'  → '2'                 ← 数字统计保留
     '夜/体'        → '夜/体'
     空白           → ''（唯一被丢弃的情况）
   ------------------------------------------------------------------------- */
function normCell(v){
  if(v==null) return '';
  let s=String(v).trim();
  if(!s) return '';
  // 占位符统一成 '/'
  if(lambdaPlaceholder(s)) return '/';
  // 已知班次（含组合班）走归一化，保证 夜 / 体 这种带空格的写法变成 夜/体
  const known=normShift(s);
  if(known) return known;
  // 数字（含小数）原样保留
  if(/^\d+(\.\d+)?$/.test(s)) return s;
  // 其余任意文本原样保留（压缩多余空白，避免公式残留）
  return s.replace(/\s+/g,' ').trim();
}
/* 两个格子内容做「追加合并」：按 / 拆分 → 去重 → 用 / 重新拼接
   '体' + '体'          → '体'            （自动去重，用户明确要求）
   '体' + '明（洁+影）'  → '体 / 明（洁+影）'
   '/' + '体'           → '体'            （占位符不参与合并展示）
   注意：括号内的 + 不拆，只在顶层按 / 拆 */
function mergeCell(oldV, newV){
  const a=splitCell(oldV).filter(x=>!lambdaPlaceholder(x));
  const b=splitCell(newV).filter(x=>!lambdaPlaceholder(x));
  const out=a.slice();
  b.forEach(x=>{ if(!out.includes(x)) out.push(x); });
  if(!out.length){
    // 两边都只是占位符：保留一个 /
    return (lambdaPlaceholder(oldV)||lambdaPlaceholder(newV)) ? '/' : '';
  }
  return out.join(' / ');
}
function matchPerson(text){
  if(!text) return '';
  const t=String(text).replace(/\s/g,'');
  const cands=allPeople().concat(DEMO_PEOPLE);
  for(const p of cands){ const base=p.replace(/（.*?）/g,''); if(t.includes(base)||t.includes(p)) return p; }
  for(const p of cands){ const base=p.replace(/（.*?）/g,''); if(base.length>=2 && t && base.includes(t)) return p; }
  return '';
}

/* =========================================================================
   7.2 排班表解析（医院真实格式：横向分段，每 7 列一周）
   -------------------------------------------------------------------------
   表格结构（没有标准表头）：
     [空/说明] | 星期一 | 星期二 | … | 星期日 | 星期一 | …   ← 星期行
     [空]      | 2026-08-31 | 2026-09-01 | …                ← 日期行
     [空]      | 叫 | 白 | 中 | 夜 | …                      ← 可能只覆盖一周
     何珍      | 叫 | 白 | 中 | 夜 |                         ← 医生行
     熊建锋    |    | 叫 | 白 | 中 | …
     （空行 / 空列自动跳过；每个「星期一」行为一个新段）
   ========================================================================= */
const WEEKDAY_SET = ['星期一','星期二','星期三','星期四','星期五','星期六','星期日',
  '周一','周二','周三','周四','周五','周六','周日','星期一~日'];

/* 这一行是不是「星期行」：含 ≥3 个星期几字样 */
function isWeekdayRow(row){
  let n=0;
  for(const c of row||[]){
    const t=String(c==null?'':c).replace(/\s/g,'');
    if(/^星期[一二三四五六日天]$/.test(t) || /^周[一二三四五六日天]$/.test(t)) n++;
  }
  return n>=3;
}
/* 这一行是不是「日期行」：含 ≥3 个可解析日期 */
function isDateRow(row, yearHint){
  let n=0;
  for(const c of row||[]) if(parseDateCell(c, yearHint)) n++;
  return n>=3;
}
/* 这一行是不是「医生行」：首列有姓名，且后面有内容（任意非空内容都算，含 体/明（洁+影）//数字） */
function isDoctorRow(row){
  const name=String((row||[])[0]==null?'':row[0]).trim();
  if(!name || name.length>12) return false;
  if(isWeekdayRow(row) || isDateRow(row)) return false;
  if(/^\d+$/.test(name)) return false;
  let cells=0;
  for(let i=1;i<row.length;i++) if(normCell(row[i])) cells++;
  return cells>=1;
}
/* 从整表里猜年份（用于补全 "9-1" 这类简写日期） */
function guessYear(rows){
  const raw=JSON.stringify(rows||[]);
  const m=raw.match(/(20\d{2})[-/年]/);
  if(m) return +m[1];
  const m2=raw.match(/[（(](20\d{2})/);
  if(m2) return +m2[1];
  return new Date().getFullYear();
}

/* 核心：把二维数组解析成 {people:[], days:{ds:{person:shift}}, ranges:[], warnings:[]} */
function parseRosterSheet(rawRows){
  const rows=(rawRows||[]).map(r=>(r||[]).map(c=>c==null?'':String(c).trim()));
  const yearHint=guessYear(rows);
  const people=[], days={}, dateSet=new Set(), warnings=[];

  // 1) 找出所有「段头」：星期行的下标
  const heads=[];
  rows.forEach((r,ri)=>{ if(isWeekdayRow(r)) heads.push(ri); });
  if(!heads.length){
    // 兼容老格式：没有星期行，退化为「表头是人名，第一列是日期」
    return parseRosterLegacy(rows, yearHint);
  }

  // 2) 逐段解析：星期行 → 日期行 → 医生行（直到下一个星期行或连续空行）
  heads.forEach((hi,si)=>{
    const segEnd = (si+1<heads.length) ? heads[si+1] : rows.length;
    // 日期行：星期行之后、且是日期行
    let dateRowIdx=-1;
    for(let ri=hi+1; ri<Math.min(hi+4,segEnd); ri++){
      if(isDateRow(rows[ri], yearHint)){ dateRowIdx=ri; break; }
    }
    if(dateRowIdx<0){ warnings.push('第 '+(hi+1)+' 行「星期」段没找到日期行，已跳过'); return; }

    // 组内列 → 日期：以星期行里的「星期一」为锚点划分 7 列一组
    const dateRow=rows[dateRowIdx];
    const colDate={};
    for(let ci=0; ci<dateRow.length; ci++){
      const ds=parseDateCell(dateRow[ci], yearHint);
      if(ds){ colDate[ci]=ds; dateSet.add(ds); }
    }
    if(!Object.keys(colDate).length){ warnings.push('第 '+(dateRowIdx+1)+' 行没解析出日期'); return; }
    // 用相邻列日期间隔补齐空缺列（有些表格日期是合并单元格）
    const cols=Object.keys(colDate).map(Number).sort((a,b)=>a-b);
    for(let k=1;k<cols.length;k++){
      const gap=cols[k]-cols[k-1];
      if(gap>1 && gap<=8){
        for(let g=1;g<gap;g++){
          const d=parseYmd(colDate[cols[k-1]]); d.setDate(d.getDate()+g);
          colDate[cols[k-1]+g]=ymd(d); dateSet.add(colDate[cols[k-1]+g]);
        }
      }
    }

    // 医生行：日期行往下，一直读到本段末尾（下一个星期行）
    // 注意：段内部常有 1~3 行空行把「主班医生」和「二线医生」分开，
    //       这些空行不能当作结束标记，否则会漏掉后面所有医生。
    let blank=0;
    for(let ri=dateRowIdx+1; ri<segEnd; ri++){
      const row=rows[ri];
      const empty=!row || !row.some(c=>c!=='');
      if(empty){ blank++; if(blank>=5) break; continue; }   // 连续 5 行空白才认定本段结束
      blank=0;
      if(isWeekdayRow(row)) break;
      if(isDateRow(row, yearHint) && ri<=dateRowIdx+3) continue;
      if(!isDoctorRow(row)) continue;
      const person=String(row[0]||'').trim();
      if(!person) continue;
      if(!people.includes(person)) people.push(person);
      for(const ci of Object.keys(colDate)){
        const ds=colDate[ci];
        const s=normCell(row[+ci]);         // 宽松版：体/明（洁+影）//数字 全部保留
        if(!s) continue;                     // 只有空白才视为「未排班」，不写入
        days[ds]=days[ds]||{};
        // 同一格里若写了重复内容，去重后写入
        days[ds][person]=mergeCell(days[ds][person], s);
      }
    }
  });

  const allDates=Array.from(dateSet).sort();
  return {people, days, dates:allDates,
    range: allDates.length ? [allDates[0], allDates[allDates.length-1]] : [],
    warnings, yearHint};
}

/* 兼容：表头是人名、第一列是日期的传统格式 */
function parseRosterLegacy(rows, yearHint){
  const people=[], days={}, dateSet=new Set(), warnings=[];
  let headIdx=-1, colPerson={};
  for(let i=0;i<Math.min(rows.length,6);i++){
    const map={}; let hit=0;
    rows[i].forEach((c,ci)=>{ const p=matchPerson(c); if(p){ map[ci]=p; hit++; } });
    if(hit>=2){ headIdx=i; colPerson=map; break; }
  }
  let dateCol=0;
  outer: for(let ci=0; ci<Math.min((rows[0]||[]).length,3); ci++){
    for(let ri=0; ri<rows.length; ri++) if(parseDateCell(rows[ri][ci],yearHint)){ dateCol=ci; break outer; }
  }
  for(let ri=headIdx+1; ri<rows.length; ri++){
    const ds=parseDateCell(rows[ri][dateCol],yearHint); if(!ds) continue;
    dateSet.add(ds);
    for(const [ci,p] of Object.entries(colPerson)){
      const s=normCell(rows[ri][+ci]); if(!s) continue;
      days[ds]=days[ds]||{}; days[ds][p]=mergeCell(days[ds][p], s);
      if(!people.includes(p)) people.push(p);
    }
  }
  const all=Array.from(dateSet).sort();
  if(!all.length) warnings.push('没有识别到有效的日期列');
  return {people, days, dates:all,
    range: all.length?[all[0],all[all.length-1]]:[],
    warnings, yearHint, legacy:true};
}

/* 预估合并影响：新增多少格、多少格会被合并、多少格不变 */
function previewMerge(res){
  let added=0, merged=0, same=0;
  Object.keys(res.days).forEach(ds=>{
    const cur=S.bigSchedule[ds]||{};
    Object.keys(res.days[ds]).forEach(p=>{
      const nv=normCell(res.days[ds][p]);
      if(!nv) return;
      const ov=normCell(cur[p]);
      if(!ov){ added++; return; }
      const m=mergeCell(ov, nv);
      if(m===ov) same++; else merged++;
    });
  });
  return {added, merged, same};
}

/* 把解析结果写入本地。
   mode='append'  追加合并（默认）：同一天同一医生的内容用 / 拼接，重复内容自动去重
   mode='replace' 覆盖重来：清空旧数据后写入本次内容              */
async function mergeRoster(res, mode){
  mode = mode==='append' ? 'append' : 'replace';
  let added=0, merged=0;

  if(mode==='replace'){
    S.bigSchedule = {};
    S.schedule = {};              // 覆盖后演示数据自动失效
  }
  Object.keys(res.days).forEach(ds=>{
    S.bigSchedule[ds] = S.bigSchedule[ds] || {};
    Object.keys(res.days[ds]).forEach(p=>{
      const nv=normCell(res.days[ds][p]);
      if(!nv) return;
      const ov=normCell(S.bigSchedule[ds][p]);
      if(!ov){ S.bigSchedule[ds][p]=nv; added++; return; }
      const m=mergeCell(ov, nv);
      if(m!==ov){ S.bigSchedule[ds][p]=m; merged++; }
    });
  });

  /* 名单：append 时做并集，不丢已有医生 */
  const prevPeople = mode==='append' ? rosterPeople() : [];
  const merged_people = prevPeople.slice();
  (res.people||[]).forEach(p=>{ if(!merged_people.includes(p)) merged_people.push(p); });
  if(merged_people.length){
    S.rosters = [{ id:uid(), name:'导入排班', people:merged_people,
      range:res.range, dates:Object.keys(S.bigSchedule).length, createdAt:Date.now() }];
    await Data.save('rosters');
  }
  await saveSchedule();
  await autoBindMyName(merged_people);
  return {added, merged, mode};
}

/* 导出当前排班为 CSV（Excel 可直接打开） */
function exportScheduleCsv(){
  const people=allPeople();
  const dates=Array.from(new Set(Object.keys(S.bigSchedule||{}))).sort();
  if(!dates.length){ toast('还没有可导出的排班'); return; }
  const weekdays=['日','一','二','三','四','五','六'];
  const lines=[];
  lines.push(['医生\\日期'].concat(dates.map(d=>d.slice(5))).join(','));
  lines.push([''].concat(dates.map(d=>'周'+weekdays[parseYmd(d).getDay()])).join(','));
  people.forEach(p=>{
    lines.push([p].concat(dates.map(d=>shiftOf(p,d)||'')).join(','));
  });
  const csv='\ufeff'+lines.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='排班_'+todayStr()+'.csv';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
  toast('已导出 CSV');
}

/* =========================================================================
   8. 日历（我的排班）

function monthDays(ym){
  const [y,m]=ym.split('-').map(Number);
  const first=new Date(y,m-1,1); const start=new Date(first); start.setDate(1-first.getDay());
  const out=[];
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    out.push({ds:ymd(d), d:d.getDate(), cur:d.getMonth()===m-1});
    if(i>=34 && d.getMonth()!==m-1 && d.getDay()===6) break;
  }
  return out;
}

/* =========================================================================
   9. 大排班 Excel 网格图（医生 × 日期，可横滑）
   ========================================================================= */
const GRID_FALLBACK = { from:'2026-09-01', to:'2026-10-12' };
/* 有导入数据时，范围由数据决定；没有则用默认 */
function gridSpan(){
  const ds=Object.keys(S.bigSchedule||{}).sort();
  if(ds.length) return { from:ds[0], to:ds[ds.length-1] };
  return GRID_FALLBACK;
}
/* 按导入范围自动切出 14 天一段 */
function gridRanges(){
  const span=gridSpan();
  const out=[]; let d=parseYmd(span.from); const end=parseYmd(span.to);
  while(d<=end){
    const from=ymd(d); const e2=new Date(d); e2.setDate(e2.getDate()+13);
    if(e2>end) e2.setTime(end.getTime());
    out.push({ name:from.slice(5)+'-'+ymd(e2).slice(5), from, to:ymd(e2) });
    d=new Date(e2); d.setDate(d.getDate()+1);
  }
  if(out.length>1) out.push({ name:'全部', from:span.from, to:span.to });
  return out.length?out:[{name:'全部', from:span.from, to:span.to}];
}
function rangeDates(i){
  const rs=gridRanges();
  const r=rs[Math.min(i,rs.length-1)]||rs[0];
  const out=[]; let d=parseYmd(r.from); const end=parseYmd(r.to);
  while(d<=end){ out.push(ymd(d)); d.setDate(d.getDate()+1); }
  return out;
}
/* 一个格子里的内容可能有多片（用 / 分隔），拆成小标签渲染
   例：体 / 明（洁+影） → 两片；单值则只渲染一片铺满 */
function cellHTML(s){
  const parts = splitCell(s);
  if(!parts.length) return '';
  if(parts.length===1){
    const v=parts[0];
    if(isKnownShift(v)) return '<span class="sh '+shiftClass(v)+'">'+esc(v)+'</span>';
    return '<span class="sh sh-plain">'+esc(v)+'</span>';
  }
  let html='<div class="cell-stack">';
  parts.forEach((v,i)=>{
    const cls = isKnownShift(v) ? ('sh '+shiftClass(v)) : 'sh sh-plain';
    html+='<span class="'+cls+'">'+esc(v)+'</span>';
  });
  html+='</div>';
  return html;
}
/* 格子的纯文本形式（用于 title 与复制） */
function cellText(s){
  const parts=splitCell(s);
  return parts.length? parts.join(' + ') : '';

/* =========================================================================
   10. 预约时间段（一个病人可跨多个时间块）
   ========================================================================= */
function segs(a){
  if(!a.segments || !a.segments.length){
    const s = a.start!=null ? a.start : DAY_START*60+120;
    a.segments = [{s:s, e:(a.end!=null?a.end:s+SLOT_MIN)}];
  }
  return a.segments;
}
const segStart = a => Math.min.apply(null, segs(a).map(x=>x.s));
const segEnd   = a => Math.max.apply(null, segs(a).map(x=>x.e));
const segText  = a => segs(a).map(x=>min2str(x.s)+'-'+min2str(x.e)).join('、');
function toothText(a){
  const t=[]; (a.charts||[]).forEach(c=>(c.teeth||[]).forEach(x=>t.push(x)));
  return t.length ? t.join(' ') : '';
}

function dayAppts(){ return S.appts.filter(a=>a.date===S.selDate).sort((a,b)=>segStart(a)-segStart(b)); }
function layoutSegs(list){
  const items=[];
  list.forEach(a=>segs(a).forEach((sg,i)=>items.push({a:a, sg:sg, i:i})));
  items.sort((x,y)=>x.sg.s-y.sg.s);
  const cols=[];
  items.forEach(it=>{
    let placed=false;
    for(let i=0;i<cols.length;i++){
      if(!cols[i].some(o=> it.sg.s < o.sg.e && o.sg.s < it.sg.e)){ cols[i].push(it); it._col=i; placed=true; break; }
    }
    if(!placed){ cols.push([it]); it._col=cols.length-1; }
  });
  items.forEach(it=>{ const w=100/cols.length; it._left=it._col*w; it._w=w; });
  return items;
}

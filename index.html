/* ---- 时间轴拖拽（长按进入拖动态 · 浏览/编辑模式）----
   设计要点：
   1) 长按 0.5s 才允许拖动；短按/轻触不触发拖动。
   2) 长按时预约块加 .dragging 视觉反馈（放大+变色），之后才能拖。
   3) 轻点（未到长按或无位移）→ 打开预约编辑；长按后拖动 → 改时间位置。
   4) 滚动优先：未长按前，手指在预约块上滑动会带动页面滚动（手动跟随 #content），
      不会误拖走病人。
   5) 浏览模式下完全不能拖动（仅轻点可打开编辑）。 */
function bindTimeline(){
  const body=$('#tlBody'); if(!body) return;
  const MOVE_TH=8, LP_MS=500, CREATE_MS=320;
  let st=null, lpTimer=null, armed=false, moved=false, lastY=0, tmpEl=null, cur=null;
  const snap5 = m => Math.round(m/5)*5;
  const yToMin = y => { const r=body.getBoundingClientRect();
    return clamp(snap5(DAY_START*60+(y-r.top)/HOUR_H*60), DAY_START*60, DAY_END*60); };
  const content = document.getElementById('content');
  const scrollBy = dy => { if(content) content.scrollTop -= dy; };  // 手动跟随手指滚动页面
  const editMode = () => S.settings.editMode!==false;
  function clearLP(){ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } }
  function arm(){                                   // 长按到点：进入可拖动态 + 视觉反馈
    if(!st || st.create) return;
    armed=true; st.armed=true;
    if(st.ap) st.ap.classList.add('dragging');
    try{ body.setPointerCapture(st.pointerId); }catch(err){}
    try{ navigator.vibrate && navigator.vibrate(15); }catch(err){}
  }
  function onDown(e){
    const ap=e.target.closest('.appt');
    if(ap && !ap.classList.contains('tmp')){
      const data=S.appts.find(a=>a.id===ap.dataset.id); if(!data) return;
      const sg=segs(data)[+ap.dataset.si]; if(!sg) return;
      const snapshot=segs(data).map(x=>({s:x.s,e:x.e}));
      const isResize = e.target.classList.contains('resize')
        ? (e.target.classList.contains('top')?'resizeTop':'resizeBottom') : 'move';
      st={ ap, data, sg, snapshot, startX:e.clientX, startY:e.clientY,
           startMin:sg.s, mode:isResize, pointerId:e.pointerId, browse:!editMode() };
      moved=false; armed=false; lastY=e.clientY; clearLP();
      if(editMode()) lpTimer=setTimeout(arm, LP_MS);   // 编辑模式：长按 0.5s 才允许拖动
      return;                                          // 此处不拦截：未长按前页面可正常滚动
    }
    if(e.target.classList.contains('half')||e.target.closest('.tl-slot')){
      const slot=e.target.closest('.tl-slot');
      st={ create:true, startMin: e.target.classList.contains('half')?yToMin(e.clientY):parseInt(slot.dataset.h)*60,
           startX:e.clientX, startY:e.clientY, pointerId:e.pointerId };
      moved=false; lastY=e.clientY;
      lpTimer=setTimeout(()=>{ if(st&&st.create){ st.mode='create'; beginCreate(); } }, CREATE_MS);
      return;
    }
  }
  function beginCreate(){
    tmpEl=document.createElement('div'); tmpEl.className='appt tmp'; body.appendChild(tmpEl);
    cur={s:st.startMin, e:st.startMin+30}; drawTmp();
    try{ body.setPointerCapture(st.pointerId); }catch(err){}
    try{ navigator.vibrate&&navigator.vibrate(12); }catch(err){}
  }
  function drawTmp(){
    tmpEl.style.top=((cur.s-DAY_START*60)/60*HOUR_H)+'px';
    tmpEl.style.height=Math.max(14,(cur.e-cur.s)/60*HOUR_H-2)+'px';
    tmpEl.innerHTML='<div class="t">'+min2str(cur.s)+' - '+min2str(cur.e)+'</div>';
  }
  function paintSeg(){
    const el=body.querySelector('.appt[data-id="'+st.data.id+'"][data-si="'+segs(st.data).indexOf(st.sg)+'"]');
    if(el){ el.style.top=((st.sg.s-DAY_START*60)/60*HOUR_H)+'px';
      el.style.height=((st.sg.e-st.sg.s)/60*HOUR_H-2)+'px'; }
  }
  function onMove(e){
    if(!st) return;
    if(st.create){
      if(st.mode!=='create'){                          // 还没进入新建：滑动即视为滚动，取消
        if(Math.abs(e.clientX-st.startX)>MOVE_TH||Math.abs(e.clientY-st.startY)>MOVE_TH){ clearLP(); st=null; }
        return;
      }
      const m=yToMin(e.clientY);
      if(m>=st.startMin){ cur.s=st.startMin; cur.e=Math.max(st.startMin+15,m); }
      else { cur.s=Math.max(DAY_START*60,m); cur.e=st.startMin; }
      cur.s=Math.max(DAY_START*60,cur.s); cur.e=Math.min(DAY_END*60,cur.e);
      if(cur.e-cur.s<15) cur.e=Math.min(DAY_END*60,cur.s+15);
      drawTmp(); e.preventDefault(); return;
    }
    if(armed){                                          // 已进入拖动态：真正拖动
      moved=true;
      if(st.mode==='move'){
        const step=snap5((e.clientY-st.startY)/HOUR_H*60);
        const arr=segs(st.data); let ok=true;
        arr.forEach((x,i)=>{ const ns=st.snapshot[i].s+step, ne=st.snapshot[i].e+step;
          if(ns<DAY_START*60||ne>DAY_END*60) ok=false; });
        if(ok) arr.forEach((x,i)=>{ x.s=st.snapshot[i].s+step; x.e=st.snapshot[i].e+step; });
        arr.forEach((x,i)=>{ const el=body.querySelector('.appt[data-id="'+st.data.id+'"][data-si="'+i+'"]');
          if(el) el.style.top=((x.s-DAY_START*60)/60*HOUR_H)+'px'; });
        e.preventDefault();
      }else if(st.mode==='resizeTop'){
        st.sg.s=clamp(yToMin(e.clientY), DAY_START*60, st.sg.e-15); paintSeg(); e.preventDefault();
      }else if(st.mode==='resizeBottom'){
        st.sg.e=clamp(yToMin(e.clientY), st.sg.s+15, DAY_END*60); paintSeg(); e.preventDefault();
      }
      return;
    }
    // 未进入拖动态（编辑模式长按前 / 浏览模式）：放行页面滚动，并检测是否滑动
    scrollBy(e.clientY-lastY); lastY=e.clientY;
    if(Math.abs(e.clientX-st.startX)>MOVE_TH||Math.abs(e.clientY-st.startY)>MOVE_TH){ moved=true; clearLP(); }
  }
  async function onUp(){
    clearLP();
    if(!st) return;
    const s=st; st=null; armed=false;
    if(s.ap) s.ap.classList.remove('dragging');
    if(s.create){
      if(s.mode!=='create') return;                     // 被滑动取消，不新建
      if(tmpEl) tmpEl.remove(); const c=cur; tmpEl=null;
      openApptEdit(null,{start:c.s,end:c.e}); return;
    }
    if(s.browse){ if(!moved) openApptEdit(s.data.id); return; }   // 浏览模式：仅轻点可打开
    if(!s.armed){ if(!moved) openApptEdit(s.data.id); return; }     // 编辑模式：轻点/滑动打开；长按拖动走提交
    // 已长按且拖动 → 提交时间调整
    await Data.put('appts', s.data);
    toast('已调整：'+segText(s.data));
    renderDay();
  }
  /* 切换日期/视图会多次调用 renderDay → 重绑前先移除上一次的监听，避免泄漏与重复处理 */
  if(body.__tlDown){ body.removeEventListener('pointerdown', body.__tlDown); }
  body.__tlDown=onDown;
  body.addEventListener('pointerdown', onDown);
  if(window.__tlMove){ window.removeEventListener('pointermove',window.__tlMove);
    window.removeEventListener('pointerup',window.__tlUp); window.removeEventListener('pointercancel',window.__tlUp); }
  window.__tlMove=onMove; window.__tlUp=onUp;
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
}
/* =========================================================================
   12. 牙位十字架组件（恒牙 / 乳牙，点击 + 拖动多选）
   ========================================================================= */
const OD_N = {permanent:8, deciduous:5};
const OD_QUADS = {permanent:[2,1,3,4], deciduous:[6,5,7,8]}; // 左上 右上 左下 右下
const OD_POS = ['qtl','qtr','qbl','qbr'];
function newChart(type){ return {id:uid(), type:type||'permanent', teeth:[], desc:'', words:[]}; }
function odHTML(c,i){
  const n=OD_N[c.type]||8, quads=OD_QUADS[c.type]||OD_QUADS.permanent;
  let cross='';
  quads.forEach((q,qi)=>{
    let seq=[]; for(let k=n;k>=1;k--) seq.push(k);
    if(qi===0||qi===2) seq=seq; else seq=seq.slice().reverse();
    cross+='<div class="od-quad '+(n===8?'q8':'q5')+' '+OD_POS[qi]+'">'+
      seq.map(x=>{ const fdi=String(q)+x; const on=(c.teeth||[]).indexOf(fdi)>=0;
        return '<div class="tooth'+(on?' sel':'')+'" data-fdi="'+fdi+'" title="FDI '+fdi+'">'+x+'</div>'; }).join('')+'</div>';
  });
  const words = S.words.length ? S.words.map(w=>w.name) : DEFAULT_WORDS;
  return '<div class="od" data-i="'+i+'">'+
    '<div class="od-head"><span class="od-title">牙位图 '+(i+1)+' · '+(c.type==='deciduous'?'乳牙':'恒牙')+'</span>'+
      '<button class="od-icon mini" data-odel="'+i+'">🗑</button></div>'+
    '<div class="od-cross">'+cross+'</div>'+
    '<div class="od-actions"><button class="od-icon" data-otoggle="'+i+'" title="切换恒牙/乳牙">🔁</button></div>'+
    '<div class="row wrap" style="margin-top:8px" data-owords="'+i+'">'+
      words.map(w=>'<button class="chip sm '+((c.words||[]).indexOf(w)>=0?'on':'')+'" data-oword="'+esc(w)+'">'+esc(w)+'</button>').join('')+
      '<button class="chip sm" data-oaddword="'+i+'" style="border-style:dashed">＋ 描述词</button></div>'+
    '<textarea class="od-desc" data-odesc="'+i+'" placeholder="这一组牙位的描述">'+esc(c.desc||'')+'</textarea>'+
    '</div>';
}
let _odCharts=[], _odOnChange=null;
function odMount(boxId, charts, onChange){
  _odCharts=charts; _odOnChange=onChange||null;
  odRender(boxId);
}
function odRender(boxId){
  const box=$(boxId); if(!box) return;
  box.innerHTML=_odCharts.map((c,i)=>odHTML(c,i)).join('')+
    '<div style="text-align:center;margin-bottom:6px">'+
    '<button class="od-icon" id="odAdd" style="margin:0 auto">＋</button>'+
    '<div class="drag-hint">新增牙位十字架</div></div>';
  odBind(boxId);
}
function odBind(boxId){
  const box=$(boxId); if(!box) return;
  const save=()=>{ if(_odOnChange) _odOnChange(_odCharts); };
  box.querySelectorAll('.od').forEach(odEl=>{
    const i=+odEl.dataset.i, c=_odCharts[i]; if(!c) return;
    const setTooth=(fdi,on)=>{
      c.teeth=c.teeth||[];
      const k=c.teeth.indexOf(fdi);
      if(on && k<0) c.teeth.push(fdi);
      if(!on && k>=0) c.teeth.splice(k,1);
      const t=odEl.querySelector('.tooth[data-fdi="'+fdi+'"]');
      if(t) t.classList.toggle('sel',on);
      save();
    };
    let painting=null;
    odEl.querySelectorAll('.tooth').forEach(t=>{
      t.addEventListener('pointerdown', e=>{
        painting = (c.teeth||[]).indexOf(t.dataset.fdi)<0;
        setTooth(t.dataset.fdi, painting);
        try{ odEl.setPointerCapture(e.pointerId); }catch(err){}
        e.preventDefault();
      });
    });
    odEl.addEventListener('pointermove', e=>{
      if(painting===null) return;
      const el=document.elementFromPoint(e.clientX,e.clientY);
      const t=el && el.closest ? el.closest('.tooth') : null;
      if(t && odEl.contains(t)) setTooth(t.dataset.fdi, painting);
    });
    ['pointerup','pointercancel'].forEach(ev=>odEl.addEventListener(ev,()=>{ painting=null; }));
    odEl.querySelectorAll('[data-oword]').forEach(b=>b.onclick=()=>{
      const w=b.dataset.oword; c.words=c.words||[];
      const k=c.words.indexOf(w);
      if(k>=0){ c.words.splice(k,1); b.classList.remove('on'); }
      else { c.words.push(w); b.classList.add('on'); }
      syncDesc(c); const ta=odEl.querySelector('[data-odesc]'); if(ta) ta.value=c.desc;
      save();
    });
  });
  box.querySelectorAll('[data-odesc]').forEach(ta=>{
    ta.oninput=()=>{ const c=_odCharts[+ta.dataset.odesc]; if(c){ c.desc=ta.value; save(); } };
  });
  box.querySelectorAll('[data-odel]').forEach(b=>b.onclick=()=>{
    _odCharts.splice(+b.dataset.odel,1); odRender(boxId); save();
  });
  box.querySelectorAll('[data-otoggle]').forEach(b=>b.onclick=()=>{
    const c=_odCharts[+b.dataset.otoggle]; if(!c) return;
    const toDec = c.type!=='deciduous';
    c.type = toDec ? 'deciduous' : 'permanent';
    /* 恒牙 ↔ 乳牙：FDI 象限映射
       恒牙象限 1~4（右上/左上/左下/右下），乳牙象限 5~8 对应同样 4 个象限。
       恒牙每象限 1~8，乳牙每象限 1~5；6/7/8 没有乳牙对应位，切换时会被舍去（给出提示）。 */
    const kept=[], dropped=[];
    (c.teeth||[]).forEach(f=>{
      const q=+f[0], n=+f.slice(1);
      if(!q||!n) return;
      if(toDec){
        if(q>=1&&q<=4){
          if(n<=5){ kept.push(String(q+4)+n); } else { dropped.push(f); }
        }
      }else{
        if(q>=5&&q<=8) kept.push(String(q-4)+n);
        else if(q>=1&&q<=4) kept.push(f);          // 已经是恒牙象限，原样保留
      }
    });
    c.teeth=kept;
    if(dropped.length) toast('恒牙 6/7/8 无对应乳牙位，已移除 '+dropped.length+' 颗');
    odRender(boxId); save();
  });
  box.querySelectorAll('[data-oaddword]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.oaddword;
    const inp=document.createElement('input');
    inp.className='input'; inp.placeholder='新描述词，回车确认'; inp.style.cssText='width:132px;padding:5px 10px;font-size:12px';
    b.parentNode.insertBefore(inp,b); inp.focus();
    const commit=async()=>{
      const v=inp.value.trim(); inp.remove();
      if(!v) return;
      if(!S.words.find(w=>w.name===v)){ const w={id:uid(),name:v}; await Data.put('words',w); }
      const c=_odCharts[i]; c.words=c.words||[]; if(c.words.indexOf(v)<0) c.words.push(v);
      syncDesc(c); odRender(boxId); save();
    };
    inp.onkeydown=e=>{ if(e.key==='Enter') commit(); };
    inp.onblur=()=>setTimeout(()=>{ if(inp.parentNode) commit(); },200);
  });
  const add=$('#odAdd'); if(add) add.onclick=()=>{ _odCharts.push(newChart('permanent')); odRender(boxId); save(); };
}
function syncDesc(c){
  const ws=(c.words||[]).slice();
  let base=(c.desc||'').split(/[、,，]/).map(s=>s.trim()).filter(s=>s && ws.indexOf(s)<0);
  c.desc = ws.concat(base).join('、');
}

/* =========================================================================
   13. 文字识别（OCR）接口：优先系统能力，其次配置端点，最后提示手填
   ========================================================================= */
function loadImage(src){
  return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
}
const OCR = {
  async recognize(dataURL){
    if('TextDetector' in window){
      try{
        const img=await loadImage(dataURL);
        const det=new window.TextDetector();
        const blocks=await det.detect(img);
        const text=blocks.map(b=>b.rawValue).join('\n');
        if(text && text.trim()) return {ok:true, text:text, via:'系统文字识别'};
      }catch(e){}
    }
    if(S.settings.ocrUrl){
      try{
        const r=await fetch(S.settings.ocrUrl,{method:'POST',
          headers:{'Content-Type':'application/json'}, body:JSON.stringify({image:dataURL})});
        const j=await r.json();
        if(j && j.text) return {ok:true, text:j.text, via:'在线识别'};
      }catch(e){}
    }
    return {ok:false, msg:'离线模式未启用文字识别，请对照图片手动填写（可在「设置」配置识别服务地址）'};
  }
};
function parseOCRText(text){
  const out={};
  const phone=(text.match(/1[3-9]\d[\s-]?\d{4}[\s-]?\d{4}/)||[])[0];
  if(phone) out.phone=phone.replace(/\D/g,'');
  const age=(text.match(/(\d{1,3})\s*(岁|周岁)/)||[])[1];
  if(age) out.age=age;
  if(/男/.test(text) && !/女/.test(text)) out.gender='男';
  else if(/女/.test(text)) out.gender='女';
  let name=(text.match(/姓\s*名[:：\s]*([^\s,，:：\d]{2,4})/)||[])[1];
  if(!name){
    const line=text.split('\n').map(s=>s.trim()).find(l=>/^[\u4e00-\u9fa5]{2,4}$/.test(l));
    if(line) name=line;
  }
  if(name) out.name=name;
  return out;
}

async function openApptEdit(id, preset){
  let a = id ? S.appts.find(x=>x.id===id) : null;
  const isNew=!a;
  /* 新建时 preset={start,end} 必须落到第一个时间段上：
     否则点 14:00 的格子，弹出来的还是默认 08:00 */
  a = a || Object.assign({id:uid(), date:S.selDate, name:'', phone:'', items:[], note:'',
       charts:[], segments:null}, preset||{});
  if(!a.segments || !a.segments.length){
    const st = a.start!=null ? a.start : DAY_START*60+120;
    const en = a.end!=null ? a.end : st+SLOT_MIN;
    a.segments=[{s:st, e:Math.max(en, st+15)}];
    delete a.start; delete a.end;
  }
  const segList=a.segments.map(x=>({s:x.s,e:x.e}));
  const charts=JSON.parse(JSON.stringify(a.charts||[]));
  if(!charts.length) charts.push(newChart('permanent'));
  const itemNames=S.items.length?S.items.map(i=>i.name):DEFAULT_ITEMS;
  const html=
    '<label class="fld"><span>病人姓名 *</span><input class="input" id="apName" value="'+esc(a.name||'')+'" '+
      'placeholder="输入姓名，已有病人自动匹配归档"></label>'+
    '<div id="apMatch" class="small" style="margin:-6px 0 10px;color:var(--accent)"></div>'+
    '<label class="fld"><span>电话</span><input class="input" id="apPhone" inputmode="tel" value="'+esc(a.phone||'')+'"></label>'+
    '<div class="divider"></div>'+
    '<div class="between" style="margin-bottom:8px"><b>牙位十字架</b><span class="small muted">点数字选牙 · 拖动多选</span></div>'+
    '<div id="apOd"></div>'+
    '<div class="divider"></div>'+
    '<div class="small muted" style="margin-bottom:6px">治疗项目（点选，每项默认半小时，自动算时长）</div>'+
    '<div id="apItems" class="row wrap" style="margin-bottom:6px">'+
      itemNames.map(n=>'<button class="chip sm '+((a.items||[]).indexOf(n)>=0?'on':'')+'" data-it="'+esc(n)+'">'+esc(n)+'</button>').join('')+
      '<button class="chip sm" id="addItemBtn" style="border-style:dashed">＋ 项目</button></div>'+
    '<div class="divider"></div>'+
    '<div class="between" style="margin-bottom:8px"><b>时间段</b><span class="small muted">一个病人可占多个时间块</span></div>'+
    '<div id="apSegs">'+segList.map((s,i)=>segRow(s,i)).join('')+'</div>'+
    '<button class="btn ghost block sm" id="apAddSeg" style="margin-bottom:10px">＋ 增加一个时间段</button>'+
    '<label class="fld"><span>备注</span><textarea class="textarea" id="apNote">'+esc(a.note||'')+'</textarea></label>'+
    '<div class="sheet-foot">'+(isNew?'':'<button class="btn danger" id="apDel">删除</button>')+
      '<button class="btn ghost" id="apCancel">取消</button><button class="btn" id="apSave">保存</button></div>';
  openSheet(isNew?'添加预约':'编辑预约', html);
  odMount('#apOd', charts, ()=>{});

  function segRow(s,i){
    return '<div class="seg-item" data-si="'+i+'">'+
      '<input type="time" class="input" data-s="'+i+'" value="'+min2str(s.s)+'" style="width:104px;padding:6px 8px">'+
      '<span class="muted">-</span>'+
      '<input type="time" class="input" data-e="'+i+'" value="'+min2str(s.e)+'" style="width:104px;padding:6px 8px">'+
      (i>0?'<button class="btn ghost sm" data-rm="'+i+'">✕</button>':'<span style="width:26px"></span>')+'</div>';
  }
  function drawSegs(){
    $('#apSegs').innerHTML=segList.map((s,i)=>segRow(s,i)).join('');
    $$('#apSegs [data-s]').forEach(inp=>inp.onchange=()=>{
      const i=+inp.dataset.s; segList[i].s=toMin(inp.value);
      if(i===0) autoDur();
      drawSegs();
    });
    $$('#apSegs [data-e]').forEach(inp=>inp.onchange=()=>{ segList[+inp.dataset.e].e=toMin(inp.value); });
    $$('#apSegs [data-rm]').forEach(b=>b.onclick=()=>{ segList.splice(+b.dataset.rm,1); drawSegs(); });
  }
  const toMin=v=>{ const p=(v||'0:0').split(':'); return (+p[0])*60+(+p[1]); };
  let sel=(a.items||[]).slice();
  function autoDur(){
    const dur=Math.max(SLOT_MIN, sel.length*SLOT_MIN);
    if(segList[0]) segList[0].e=Math.min(DAY_END*60, segList[0].s+dur);
  }
  $$('#sheet [data-it]').forEach(b=>b.onclick=()=>{
    const n=b.dataset.it;

  });
  $('#addItemBtn').onclick=()=>{

    const inp=$('#newItemInput'); inp.focus();
    const commit=async()=>{
      const n=inp.value.trim(); if(!n){ inp.remove(); return; }
      if(!S.items.find(i=>i.name===n)) await Data.put('items',{id:uid(),name:n});
      if(sel.indexOf(n)<0) sel.push(n);
      inp.remove();
      $('#apItems').insertAdjacentHTML('beforeend','<button class="chip sm on" data-it="'+esc(n)+'">'+esc(n)+'</button>');
      const nb=$$('#apItems [data-it]').pop();
      nb.onclick=()=>{ if(sel.indexOf(n)>=0) sel=sel.filter(x=>x!==n); else sel.push(n);
        nb.classList.toggle('on'); autoDur(); drawSegs(); };
      autoDur(); drawSegs();
    };
    inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); } };
    inp.onblur=()=>setTimeout(()=>{ if(document.getElementById('newItemInput')) commit(); },200);
  };
  $('#apAddSeg').onclick=()=>{
    const last=segList[segList.length-1]||{s:DAY_START*60,e:DAY_START*60+30};
    let s=Math.min(DAY_END*60-30, last.e+30);
    segList.push({s:s, e:Math.min(DAY_END*60, s+SLOT_MIN)}); drawSegs();
  };
  drawSegs();
  $('#apName').oninput=()=>{
    const p=findPatientByName($('#apName').value);
    $('#apMatch').textContent = p ? ('✓ 已匹配档案「'+p.name+'」'+(p.phone?' 电话 '+p.phone:'')+'，自动归档') : '';
    if(p && !$('#apPhone').value) $('#apPhone').value=p.phone||'';
  };
  /* 姓名输入：接自定义下拉；选中历史患者直接把电话带出来。
     注意：onInput 里不要再 dispatch('input')，否则会和自己形成死循环 */
  nameCombo($('#apName'), {
    onInput(){
      const val=$('#apName').value;
      const p=findPatientByName(val);
      $('#apMatch').textContent = p ? ('✓ 已匹配档案「'+p.name+'」'+(p.phone?' 电话 '+p.phone:'')+'，自动归档') : '';
      if(p && !$('#apPhone').value) $('#apPhone').value=p.phone||'';
    },
    onPick(x){
      if(x.phone && !$('#apPhone').value.trim()) $('#apPhone').value=x.phone;
      $('#apMatch').textContent='✓ 已匹配档案「'+x.name+'」'+(x.phone?(' 电话 '+x.phone):'')+'，自动归档';
    }
  });
  $('#apName').dispatchEvent(new Event('input'));
  $('#apCancel').onclick=closeSheet;
  $('#apDel') && ($('#apDel').onclick=async()=>{
    if(await confirmBox('删除预约','删除这条预约？','删除')){
      await Data.del('appts', a.id); closeSheet(); renderDay();
    }
  });
  $('#apSave').onclick=async()=>{
    const name=$('#apName').value.trim();
    if(!name){ toast('请填姓名'); return; }
    const phone=$('#apPhone').value.trim();
    const p=await ensurePatient(name,{phone:phone});

      return {s:s, e:e};
    }).filter(x=>x.s<DAY_END*60);
    if(!segs2.length) segs2.push({s:DAY_START*60+120, e:DAY_START*60+150});

      note:$('#apNote').value.trim(), segments:segs2, date:S.selDate});

/* 图片缩放 / 拖动 */
function bindEntryZoom(){
  const stage=$('#epStage'), img=$('#epImg');
  if(!stage||!img) return;
  const apply=()=>{ img.style.transform='translate('+_entry.tx+'px,'+_entry.ty+'px) scale('+_entry.zoom+')'; };
  apply();
  let drag=false, sx=0, sy=0, ox=0, oy=0, pinch=false, d0=0, z0=1;
  let touches={};
  stage.addEventListener('touchstart', ev=>{
    if(ev.touches.length===1){
      drag=true; const t=ev.touches[0]; sx=t.clientX; sy=t.clientY; ox=_entry.tx; oy=_entry.ty;
    }else if(ev.touches.length===2){
      drag=false; pinch=true;
      const a=ev.touches[0], b=ev.touches[1];
      d0=Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); z0=_entry.zoom;
    }
  },{passive:true});
  stage.addEventListener('touchmove', ev=>{
    if(pinch && ev.touches.length===2){
      const a=ev.touches[0], b=ev.touches[1];
      const d=Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
      _entry.zoom=clamp(z0*(d/(d0||1)), 1, 6); apply(); ev.preventDefault();
    }else if(drag && ev.touches.length===1){
      const t=ev.touches[0];
      _entry.tx=ox+(t.clientX-sx); _entry.ty=oy+(t.clientY-sy); apply(); ev.preventDefault();
    }
  },{passive:false});
  const endT=()=>{ drag=false; pinch=false; };
  stage.addEventListener('touchend', endT);
  stage.addEventListener('touchcancel', endT);
  /* 鼠标拖动（桌面调试） */
  stage.addEventListener('pointerdown', ev=>{
    if(ev.pointerType==='touch') return;
    drag=true; sx=ev.clientX; sy=ev.clientY; ox=_entry.tx; oy=_entry.ty;
  });
  stage.addEventListener('pointermove', ev=>{
    if(ev.pointerType==='touch'||!drag) return;
    _entry.tx=ox+(ev.clientX-sx); _entry.ty=oy+(ev.clientY-sy); apply();
  });
  stage.addEventListener('pointerup', ()=>{ drag=false; });
  $('#epZoomIn').onclick=()=>{ _entry.zoom=clamp(_entry.zoom*1.3,1,6); apply(); };
  $('#epZoomOut').onclick=()=>{ _entry.zoom=clamp(_entry.zoom/1.3,1,6); apply(); };
  $('#epZoomReset').onclick=()=>{ _entry.zoom=1; _entry.tx=0; _entry.ty=0; apply(); };
}

  const p=await ensurePatient(name,{phone:phone});
  const appt = Object.assign({id:uid(), date:dt, name:p.name, patientId:p.id, phone:phone,
    items:e.items.slice(), charts:JSON.parse(JSON.stringify(e.charts||[])), note:note, segments:segs2,
    from:'entry', createdAt:Date.now()});
  await Data.put('appts', appt);

  /* 照片存入影像档案，分类「预约本」 */
  if(e.img){
    if(!S.imgcats.find(c=>c.name==='预约本')){
      await Data.put('imgcats',{id:uid(),name:'预约本'});
    }
    await Data.put('images',{ id:uid(), name:(e.rawName||'预约本'),
      category:'预约本', data:e.img, desc:(name+' · '+dt+' '+segText(appt)+(note?(' · '+note):'')),
      patientId:p.id, createdAt:Date.now() });
  }

  S.selDate=dt;
  toast('已保存：'+p.name+' '+dt.slice(5)+' '+segText(appt));
  if(andNext){
    /* 保留图片方便继续录同一天的下一条 */
    e.name=''; e.phone=''; e.note=''; e.items=[]; e.charts=[newChart('permanent')];
    const start=clamp(e.segs[e.segs.length-1].e, DAY_START*60, DAY_END*60-30);
    e.segs=[{s:start, e:start+SLOT_MIN}];
    renderEntry();
  }else{
    closeEntry();
  }
}
/* OCR 预留接口：接百度 / 腾讯云时只改这里 */
async function ocrImage(base64){
  // 1) 浏览器自带文字识别（部分机型可用）
  if('TextDetector' in window){
    try{
      const img=await loadImage(base64);
      const det=new window.TextDetector();
      const blocks=await det.detect(img);
      const text=blocks.map(b=>b.rawValue).join('\n');
      if(text && text.trim()) return {ok:true, text:text, via:'系统文字识别'};
    }catch(err){}
  }
  // 2) 用户配置的 OCR 服务（设置里填 URL / Key）
  const url=S.settings.ocrUrl;
  if(url){
    try{
      const r=await fetch(url,{method:'POST',
        headers:Object.assign({'Content-Type':'application/json'},
          S.settings.ocrKey?{'Authorization':'Bearer '+S.settings.ocrKey}:{}),
        body:JSON.stringify({image:base64})});
      const j=await r.json();
      const text=j.text||j.result||(j.words||[]).join('\n');
      if(text && String(text).trim()) return {ok:true, text:String(text), via:'在线识别'};
      return {ok:false, msg:'识别服务没有返回文字'};
    }catch(err){
      return {ok:false, msg:'识别服务请求失败：'+err.message};
    }
  }
  return {ok:false, msg:'当前为离线版，暂不支持自动识别，请手动填写。'};
}
/* 把识别文本解析成预约字段（含中文数字牙位） */
function parseApptOCR(text){
  const out={};
  if(!text) return out;
  const t=String(text);
  const phone=(t.match(/1[3-9]\d[\s-]?\d{4}[\s-]?\d{4}/)||[])[0];
  if(phone) out.phone=phone.replace(/\D/g,'');
  // 时间 8:30-9:00 / 10:00—10:30
  const segs=[];
  const tm=t.match(/(\d{1,2})[:：](\d{2})\s*[-—~至]\s*(\d{1,2})[:：](\d{2})/g)||[];
  tm.forEach(s=>{
    const m=s.match(/(\d{1,2})[:：](\d{2})\s*[-—~至]\s*(\d{1,2})[:：](\d{2})/);
    if(m) segs.push({s:(+m[1])*60+(+m[2]), e:(+m[3])*60+(+m[4])});
  });
  if(segs.length) out.segs=segs.sort((a,b)=>a.s-b.s);
  // 日期 9/17、2026-09-17
  const dm=t.match(/(20\d{2})[-/年](\d{1,2})[-/月](\d{1,2})/);
  if(dm) out.date=dm[1]+'-'+pad2(+dm[2])+'-'+pad2(+dm[3]);
  else{
    const dm2=t.match(/(?<!\d)(\d{1,2})[\/月](\d{1,2})(?!\d)/);
    if(dm2) out.date=new Date().getFullYear()+'-'+pad2(+dm2[1])+'-'+pad2(+dm2[2]);
  }
  // 牙位：中文数字（十、十一、十六、四十六）→ FDI
  const teeth=[], raw=[];
  const cnNums=['零','一','二','三','四','五','六','七','八','九'];
  const cn2num=s=>{
    s=String(s).trim();
    if(s==='十') return 10;
    if(s[0]==='十') return 10+(cnNums.indexOf(s[1])||0);
    const i=s.indexOf('十');
    if(i>0) return (cnNums.indexOf(s[0]))*10 + (s[1]? (cnNums.indexOf(s[i+1])||0):0);
    return cnNums.indexOf(s);
  };
  const re=/([一二三四五六七八九十]{1,3})\s*(?:号牙|牙)?/g; let mm;
  while((mm=re.exec(t))){
    const n=cn2num(mm[1]);
    if(n>=11 && n<=48){ const f=String(n); if(!teeth.includes(f)) teeth.push(f); raw.push(mm[1]); }
  }
  [...new Set((t.match(/(?<![\d])([1-4][1-8])(?![\d])/g)||[]))].forEach(f=>{
    if(!teeth.includes(f)){ teeth.push(f); raw.push(f); }
  });
  if(teeth.length){ out.teeth=teeth.sort(); out.teethText=raw.join('、'); }
  // 治疗项目
  const items=[];
  (S.items.length?S.items.map(i=>i.name):DEFAULT_ITEMS).forEach(n=>{ if(t.indexOf(n)>=0) items.push(n); });
  if(items.length) out.items=items;
  // 姓名：找 2-4 个汉字、且不是项目名/关键词的行
  const STOP=/^(预约|电话|姓名|时间|日期|牙位|治疗|备注|星期|上午|下午)/;
  const badWord=new Set([].concat(DEFAULT_ITEMS, (S.items||[]).map(i=>i.name),
    DEFAULT_WORDS, ['初诊','复诊','拆线','复检','洁治','麻醉','拍片']));
  const lines=t.split(/[\n\r，,、\s]+/).map(s=>s.trim()).filter(Boolean);
  for(const l of lines){
    if(/^[\u4e00-\u9fa5]{2,4}$/.test(l) && !STOP.test(l) && !badWord.has(l)){
      out.name=l; break;
    }
  }
  return out;
}

/* ---- 病人姓名/电话匹配归档 ---- */
function findPatientByName(name){
  if(!name) return null;
  const n=String(name).trim();
  return S.patients.find(p=>p.name===n) ||
    S.patients.find(p=>p.name && n.length>=2 && (p.name.indexOf(n)>=0 || n.indexOf(p.name)>=0)) || null;
}
function findPatientByPhone(phone){
  if(!phone) return null;
  const p=String(phone).replace(/\D/g,'');
  if(p.length<5) return null;
  return S.patients.find(x=>String(x.phone||'').replace(/\D/g,'')===p)||null;
}
async function ensurePatient(name, extra){
  let p=findPatientByName(name)||(extra&&extra.phone?findPatientByPhone(extra.phone):null);
  if(p){
    let changed=false;
    if(extra) for(const k in extra){ if(extra[k] && !p[k]){ p[k]=extra[k]; changed=true; } }
    p.updatedAt=Date.now();
    if(changed) await Data.put('patients',p);
  }else{
    p=Object.assign({id:uid(), name:String(name).trim(), phone:'', gender:'', age:'', tags:[],
      charts:[], note:'', createdAt:Date.now(), updatedAt:Date.now()}, extra||{});
    await Data.put('patients',p);
  }
  return p;
}

function odReadHTML(c){
  const n=OD_N[c.type]||8, quads=OD_QUADS[c.type]||OD_QUADS.permanent;
  let cross='';
  quads.forEach((q,qi)=>{
    let seq=[]; for(let k=n;k>=1;k--) seq.push(k);
    if(qi===1||qi===3) seq=seq.slice().reverse();
    cross+='<div class="od-quad '+(n===8?'q8':'q5')+' '+OD_POS[qi]+'" style="pointer-events:none">'+
      seq.map(x=>{ const fdi=String(q)+x; const on=(c.teeth||[]).indexOf(fdi)>=0;
        return '<div class="tooth'+(on?' sel':'')+'">'+x+'</div>'; }).join('')+'</div>';
  });
  return '<div class="od" style="pointer-events:none"><div class="od-head"><span class="od-title">'+
    (c.type==='deciduous'?'乳牙':'恒牙')+'</span></div><div class="od-cross">'+cross+'</div>'+
    (c.desc?'<div class="small" style="margin-top:6px;color:#444">'+esc(c.desc)+'</div>':'')+'</div>';

function guessPatient(filename){
  if(!filename) return null;
  const s=String(filename);
  let best=null, bestLen=0;
  for(const p of S.patients){
    if(!p.name||p.name.length<2) continue;
    if(s.indexOf(p.name)>=0 && p.name.length>bestLen){ best=p; bestLen=p.name.length; }
  }
  if(best) return best;
  const clean=s.replace(/[_\-\s]*(正面|侧面|口内|术前|术后|面照|全景|根尖|CT|CBCT|小牙片|\d{6,}|IMG|DSC|微信图片)[_\-\s]*/gi,'')
    .replace(/[0-9_\-\s()（）]+/g,'');
  for(const p of S.patients) if(p.name && clean.indexOf(p.name)>=0 && p.name.length>bestLen){ best=p; bestLen=p.name.length; }
  if(best) return best;
  for(const p of S.patients) if(p.name && p.name.length>=2 && clean && clean.indexOf(p.name.slice(0,2))>=0) return p;
  return null;
}

const SOUNDS={beep:'提示音',chime:'和弦',bell:'铃声',custom:'自定义音频'};
let audioCtx=null, customAudio=null, alarmLoop=null;
function ac(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function playBeep(kind, vol){
  try{
    const c=ac(), g=c.createGain(); g.connect(c.destination); g.gain.value=(vol==null?0.7:vol);
    const now=c.currentTime;
    if(kind==='beep'){
      [0,0.35,0.7].forEach(t=>{ const o=c.createOscillator(); o.type='square'; o.frequency.value=880;
        o.connect(g); o.start(now+t); o.stop(now+t+0.16); });
    }else if(kind==='chime'){
      [523.25,659.25,783.99,1046.5].forEach((f,i)=>{ const o=c.createOscillator(); o.type='sine'; o.frequency.value=f;
        const gg=c.createGain(); o.connect(gg); gg.connect(g);
        gg.gain.setValueAtTime(0.0001,now+i*0.16);
        gg.gain.exponentialRampToValueAtTime(1,now+i*0.16+0.02);
        gg.gain.exponentialRampToValueAtTime(0.0001,now+i*0.16+0.6);
        o.start(now+i*0.16); o.stop(now+i*0.16+0.7); });
    }else{
      [1318.5,1760].forEach(f=>{ const o=c.createOscillator(); o.type='triangle'; o.frequency.value=f;
        const gg=c.createGain(); o.connect(gg); gg.connect(g);
        gg.gain.setValueAtTime(0.9,now); gg.gain.exponentialRampToValueAtTime(0.001,now+1.2);
        o.start(now); o.stop(now+1.3); });
    }
  }catch(e){}
}
function playSound(kind, vol, loop){
  if(kind==='custom' && S.settings.customSound){
    try{ customAudio=new Audio(S.settings.customSound); customAudio.volume=(vol==null?0.7:vol);
      customAudio.loop=!!loop; customAudio.play().catch(()=>{}); }catch(e){}
    return;
  }
  playBeep(kind, vol);
  if(loop){ clearInterval(alarmLoop); alarmLoop=setInterval(()=>playBeep(kind,vol),2200); }
}
function stopSound(){ if(alarmLoop){ clearInterval(alarmLoop); alarmLoop=null; }
  if(customAudio){ customAudio.pause(); customAudio=null; } }

function checkAlarms(){
  const now=new Date(), ds=ymd(now), hm=pad2(now.getHours())+':'+pad2(now.getMinutes());
  if(now.getSeconds()>8) return;
  for(const r of S.reminders){
    if(r.done) continue;
    if(r.date && r.date!==ds) continue;
    if(r.time!==hm) continue;
    if(r._fired===ds+hm) continue;
    r._fired=ds+hm; fireAlarm(r);
  }
}

/* =========================================================================
   离线整包（含全部数据，单文件 HTML，换设备打开即恢复）
   -------------------------------------------------------------------------
   原理：把当前内存数据序列化为 JSON，base64 后塞进一个 <script id="embedded-data">
   标签；整份文档 outerHTML 另存为新 HTML。新设备用浏览器打开该文件时，启动阶段
   检测到 #embedded-data 就自动写回 IndexedDB / localStorage，效果等同「在原设备导出、
   在另一台设备导入」。影像（base64）一并内嵌，整包体积可能较大属正常。
   注意：base64 字母表不含 < > &，可安全放在 <script> 文本节点里，不会被 HTML 解析截断。
   ========================================================================= */
function b64enc(str){ try{ return btoa(unescape(encodeURIComponent(str))); }catch(e){ return btoa(str); } }
function b64dec(b64){ try{ return decodeURIComponent(escape(atob(b64))); }catch(e){ return atob(b64); } }
function downloadText(text, name, mime){
  const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ try{ a.remove(); URL.revokeObjectURL(a.href); }catch(e){} },2000);
}
const PKG_STORES=['patients','appts','images','stock','reminders','items','imgcats','words','rosters'];
/* 收集当前全部数据为 payload（含影像，便于整设备恢复） */
async function buildPayload(){
  const stores={};
  for(const k of PKG_STORES) stores[k]=S[k]||[];
  return { v:2, at:Date.now(), app:'口腔工作台',
    stores,
    schedule:{xy:S.schedule, big:S.bigSchedule},
    settings:S.settings,
    users:Auth._users(),
    session:Auth.current() };
}
/* 把 payload 覆盖式写回存储；启动时调用，随后 loadAll 会读出来填充界面 */
async function writePayloadToStorage(d){
  const stores=(d.stores)||{};
  for(const k of PKG_STORES){
    const arr=Array.isArray(stores[k])?stores[k]:(Array.isArray(d[k])?d[k]:[]);
    await IDB.clear(k);
    for(const o of arr) if(o&&o.id!=null) await IDB.put(k,o);
  }
  const xy=(d.schedule&&d.schedule.xy)||{};
  const big=(d.schedule&&d.schedule.big)||{};
  S.schedule=xy; S.bigSchedule=big; await saveSchedule();
  if(d.settings){ S.settings=Object.assign({},DEFAULT_SETTINGS,d.settings); saveSettings(); renderSidebar(); }
  if(Array.isArray(d.users)){ try{ localStorage.setItem('wb_users',JSON.stringify(d.users)); }catch(e){} }
  if(d.session){ try{ localStorage.setItem('wb_session',JSON.stringify(d.session)); }catch(e){} }
}
/* 启动阶段：若本文件内嵌了 #embedded-data，则自动恢复（覆盖式） */
async function maybeRestoreEmbedded(){
  const el=document.getElementById('embedded-data');
  if(!el || !el.textContent || !el.textContent.trim()) return;
  try{
    const d=JSON.parse(b64dec(el.textContent.trim()));
    await writePayloadToStorage(d);
    let n=0; for(const k of PKG_STORES) n+=(((d.stores&&d.stores[k])||[]).length);
    if(d.schedule&&d.schedule.big) n+=Object.keys(d.schedule.big).length;
    toast('已从离线整包恢复 '+n+' 条数据');
  }catch(e){ console.warn('离线整包恢复失败：',e); }
}
/* 导出当前数据为单文件 HTML 整包（打开即恢复） */
async function exportOfflinePackage(){
  try{
    const payload=await buildPayload();
    const data='<script id="embedded-data" type="application/json">'+b64enc(JSON.stringify(payload))+'<\/script>';
    /* 用随机注释标记定位插入点。关键点：标记串绝不能写死在源码字面量里——
       否则 outerHTML 序列化后该串会原样出现在主脚本文本中，html.replace 会先命中脚本内的它，
       把整包结构打乱（实测会报 “Invalid or unexpected token”）。运行时现拼标记串即可避开。 */
    const tokText='PKG'+Date.now()+Math.random().toString(36).slice(2,8);
    const marker=document.createComment(tokText);
    document.body.appendChild(marker);
    let html='<!doctype html>\n'+document.documentElement.outerHTML;
    html=html.replace('<!--'+tokText+'-->', data+'\n');
    downloadText(html,'口腔工作台_离线整包_'+todayStr()+'.html','text/html;charset=utf-8');
    toast('已导出离线整包（含全部数据），发给新手机打开即可恢复');
  }catch(e){ toast('导出失败：'+e.message); }
}

/* =========================================================================
   23. PWA：安装到桌面 + Service Worker
   -------------------------------------------------------------------------
   资源全部是「独立文件」形式（manifest.json / icons/*.png / sw.js），
   这样才是标准 PWA，能通过浏览器安装、能被 Service Worker 缓存。

   两种运行环境：
     · http(s) 部署（CloudBase 静态托管）→ 完整 PWA：可安装、可离线打开
     · file:// 直接双击打开（单文件离线包）→ 浏览器禁止 SW 与 manifest，
       只保留内联图标兜底，其余功能不受影响。
   ========================================================================= */

/* ---- 23.1 判断运行环境 ---- */
function isHttp(){ return /^https?:$/.test(location.protocol); }
/* 是否以「已安装的 App」方式运行：从桌面图标打开 → 独立窗口，无浏览器地址栏。
   安卓/桌面 Chrome：display-mode 为 standalone / fullscreen / minimal-ui
   iOS Safari：navigator.standalone 为 true
   ⚠ 这个判断只影响「提示文案」和样式微调；
     真正决定有没有地址栏的是 manifest.json 里的 display:"standalone" —— 
     必须通过网址访问且已「添加到主屏幕」，从桌面图标进入才会全屏。 */
const isStandalone = ()=>
  (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
  (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) ||
  window.navigator.standalone === true;
/* 是否 iOS / iPadOS（用于给出「添加到主屏幕」的专用引导） */
const isIOS = ()=> /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
/* 给 <html> 打标记，供 CSS 做全屏适配（安全区、贴边等） */
function applyDisplayMode(){
  const on = isStandalone();
  document.documentElement.setAttribute('data-standalone', on ? '1' : '0');
  document.documentElement.setAttribute('data-ios', isIOS() ? '1' : '0');
  /* 旧 WebView 不支持 dvh 时，用 JS 算一个 --vh 兜底，
     保证独立窗口下高度真正等于可视区（不会被地址栏残留挤掉一截） */
  const setVh = ()=>{
    try{ document.documentElement.style.setProperty('--vh', (window.innerHeight*0.01)+'px'); }catch(e){}
  };
  setVh();
  if(!window.__vhBound){
    window.__vhBound = true;
    window.addEventListener('resize', ()=>{ setVh(); }, {passive:true});
    window.addEventListener('orientationchange', ()=>{ setTimeout(setVh,120); }, {passive:true});
  }
  /* 从浏览器标签页切到独立窗口（或反之）时实时更新 */
  try{
    const mq = window.matchMedia('(display-mode: standalone)');
    const onMq = ()=>applyDisplayMode();
    if(mq.addEventListener) mq.addEventListener('change', onMq);
    else if(mq.addListener) mq.addListener(onMq);
  }catch(e){}
  return on;
}
/* Service Worker 仅在安全上下文可用：https 或 localhost/127.0.0.1 */
function swAllowed(){
  if(!('serviceWorker' in navigator)) return false;
  if(location.protocol==='https:') return true;
  const h=location.hostname;
  return location.protocol==='http:' && (h==='localhost'||h==='127.0.0.1'||h==='[::1]');
}
/* 相对当前页面的资源地址：把 ./xxx 解析成绝对 URL，避免子路径部署时失效 */
function assetURL(path){
  try{ return new URL(path, location.href).href; }catch(e){ return path; }
}

/* ---- 23.2 图标与 manifest 落地 ----
   http(s) 下使用独立文件；file:// 下浏览器读不了相对路径的资源清单，
   于是退回 dataURL 内联，至少保证「添加到主屏幕」时图标不是空白。 */
function svgIconURI(){
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">'+
    '<rect width="512" height="512" rx="96" fill="#5BA89B"/>'+
    '<path d="M256 36c-107 0-186 30-186 250 0 96 22 130 46 130s30-40 40-72c7-23 27-35 40-35h120c13 0 33 12 40 35 10 32 16 72 40 72s46-34 46-130C442 66 363 36 256 36z" fill="#fff"/></svg>';
  return 'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
}
function buildPWA(){
  const manifest = $('#appManifest');
  if(isHttp()){
    /* 标准模式：指向独立文件（src/index.html 里已写好默认值，这里兜底校正） */
    if(manifest && !manifest.getAttribute('href')) manifest.href='./manifest.json';
    const ic=$('#appIcon');  if(ic && !ic.getAttribute('href')) ic.href='./icons/apple-touch-icon.png';
    const ic2=$('#appIcon2'); if(ic2 && !ic2.getAttribute('href')) ic2.href='./icons/icon-192.png';
    return;
  }
  /* file:// 兜底：内联图标 + 内联 manifest，保证双击打开也有图标 */
  const uri=svgIconURI();
  const ic=$('#appIcon'), ic2=$('#appIcon2');
  if(ic) ic.href=uri;
  if(ic2) ic2.href=uri;
  try{
    const mf={name:'口腔工作台', short_name:'工作台', start_url:'.', display:'standalone',
      background_color:'#F7FAF9', theme_color:'#5BA89B', orientation:'portrait',
      icons:[{src:uri,sizes:'any',type:'image/svg+xml',purpose:'any'}]};
    if(manifest) manifest.href='data:application/manifest+json;base64,'+
      btoa(unescape(encodeURIComponent(JSON.stringify(mf))));
  }catch(e){}
}

/* ---- 23.3 Service Worker 注册 ---- */
let _swReg=null, _swUpdateReady=false;
async function registerSW(){
  if(!swAllowed()) return null;
  try{
    _swReg = await navigator.serviceWorker.register(assetURL('./sw.js'), {scope:'./'});
    /* 有新版本在等待 → 提示用户，点一下立即切换（不用手动关标签页） */
    _swReg.addEventListener('updatefound', ()=>{
      const nw=_swReg.installing;
      if(!nw) return;
      nw.addEventListener('statechange', ()=>{
        if(nw.state==='installed' && navigator.serviceWorker.controller){
          _swUpdateReady=true;
          updatePWAStatus();
          toast('有新版本，点「设置 → 重启更新」即可使用');
        }
      });
    });
    /* 页面重新获得控制权时刷新状态 */
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{ _swUpdateReady=false; });
    return _swReg;
  }catch(e){
    console.warn('[pwa] Service Worker 注册失败：', e && e.message);
    return null;
  }
}
/* 主动切换到新版本 */
async function applySWUpdate(){
  try{
    if(_swReg && _swReg.waiting){ _swReg.waiting.postMessage({type:'SKIP_WAITING'});
      setTimeout(()=>location.reload(), 300); return true; }
    if(_swReg){ await _swReg.update(); toast('已检查更新'); }
    else { location.reload(); }
  }catch(e){ toast('更新失败：'+(e.message||'')); }
  return false;
}

/* ---- 23.4 安装到桌面 ---- */
let _installEvt=null;                 // 浏览器给的安装事件（Chrome/Edge/安卓）
/* isStandalone() 与 isIOS() 已在 23.1 统一定义，这里不再重复声明 */

/* 当前是否可以「一键安装」 */
function canInstallNow(){ return !!_installEvt; }
function installHintText(){
  if(isStandalone()) return '已安装到桌面，当前正以 App 方式运行。';
  if(canInstallNow()) return '点击下面按钮，浏览器会弹出安装确认。';
  if(isIOS()) return 'iOS 请点 Safari 底部「分享」→「添加到主屏幕」。';
  if(!isHttp()) return '当前是本地文件打开（file://），浏览器不允许安装。请把工作台部署到网址后再安装。';
  return '若浏览器菜单里有「安装应用 / 添加到主屏幕」，点它即可；也可以等页面提示出现后再点上面的按钮。';
}
async function doInstall(){
  /* 1) 浏览器支持一键安装 */
  if(_installEvt){
    try{
      _installEvt.prompt();
      const r = await _installEvt.userChoice;
      _installEvt = null;
      if(r && r.outcome==='accepted'){ toast('已开始安装，请查看桌面'); }
      else { toast('已取消安装'); }
      updatePWAStatus(); renderSettings();
    }catch(e){ toast('安装失败：'+(e.message||'')); }
    return;
  }
  /* 2) 已经装过了 */
  if(isStandalone()){ toast('已经安装到桌面了'); return; }
  /* 3) iOS：给出图文引导 */
  if(isIOS()){ showIOSInstallGuide(); return; }
  /* 4) 其它情况：告诉用户去浏览器菜单 */
  if(!isHttp()){ toast('请先部署到网址（http/https）后再安装'); return; }
  toast('请在浏览器菜单里选择「安装应用」或「添加到主屏幕」');
}
function showIOSInstallGuide(){
  openSheet('iPhone / iPad 安装步骤',
    '<div class="small" style="line-height:1.9">'+
    '<b>1.</b> 用 <b>Safari</b> 打开本页面（微信内打开无效，请点右上角「⋯」→ 在 Safari 中打开）<br>'+
    '<b>2.</b> 点屏幕底部中间的「<b>分享</b>」按钮 <span style="font-size:18px">⬆️</span><br>'+
    '<b>3.</b> 在弹出菜单里向下找到「<b>添加到主屏幕</b>」<br>'+
    '<b>4.</b> 点右上角「<b>添加</b>」，桌面上就会出现「工作台」图标'+
    '</div>'+
    '<div class="login-tip" style="margin-top:12px;text-align:left">添加后从桌面图标打开，可全屏使用且支持离线。</div>',
    {onMount:sh=>{
      const b=document.createElement('button');
      b.className='btn block'; b.textContent='知道了'; b.style.marginTop='12px';
      b.onclick=closeSheet; sh.querySelector('#sheetBody').appendChild(b);
    }});
}

/* ---- 23.5 状态展示（设置页用） ---- */
function pwaStatus(){
  const items=[];
  items.push({k:'运行方式', v: isStandalone() ? '独立窗口（App 模式，无地址栏）'
                                               : '浏览器标签页（有地址栏）'});
  items.push({k:'安装到桌面', v: isStandalone() ? '已安装' :
    (canInstallNow() ? '可以一键安装' : (isIOS() ? 'iOS 需手动添加' : '从浏览器菜单安装'))});
  items.push({k:'离线缓存', v: swAllowed() ? (_swReg ? '已启用（断网可打开）' : '注册中…') : '不可用（需 http/https 打开）'});
  items.push({k:'网络', v: navigator.onLine ? '在线' : '离线（数据先存本机）'});
  return items;
}
/* 非独立窗口时，给出「怎么才能变成 App」的明确指引 */
function displayModeHint(){
  if(isStandalone()) return '';
  return '<div class="login-tip" style="margin-top:10px;text-align:left;line-height:1.7">'+
    '⚠ 当前是<b>浏览器标签页</b>（上方有地址栏）。要变成全屏 App：<br>'+
    (isIOS()
      ? '① 点 Safari 底部「分享」按钮　② 选「添加到主屏幕」　③ 回桌面点新图标打开。'
      : '① 点浏览器右上角「⋮ / 分享」　② 选「安装应用 / 添加到主屏幕」　③ 回桌面点新图标打开。')+
    '<br>从桌面图标打开后，本行提示会消失，并显示「独立窗口（App 模式）」。'+
    '</div>';
}
function updatePWAStatus(){
  const box=$('#pwaStatus'); if(!box) return;
  box.innerHTML = pwaStatus().map(x=>'<div class="small muted" style="line-height:1.8">'+
    esc(x.k)+'：<b>'+esc(x.v)+'</b></div>').join('') + displayModeHint();
  const b=$('#setInstall');
  if(b) b.textContent = isStandalone() ? '已安装到桌面' : (canInstallNow() ? '安装到桌面' : '如何安装到桌面');
}
/* 联网状态变化时刷新顶栏标记（离线 / 待同步） */
function updateOnlineBadge(){
  try{ renderTop(); }catch(e){}
}
/* 登录页也放一个安装入口：可以一键安装时显示，否则显示"如何安装" */
function updateLoginInstall(){
  const b=$('#lgInstall'); if(!b) return;
  if(isStandalone()){ b.style.display='none'; return; }
  b.style.display='';                       // 总是给个入口，点了会给出对应提示
  b.textContent = canInstallNow() ? '安装到桌面' : '如何安装到桌面';
  if(!b._wired){
    b._wired=true;
    b.onclick=()=>doInstall();
  }
}
function initPWAEvents(){
  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault();               // 拦下默认横幅，改为我们自己的按钮
    _installEvt = e;
    updatePWAStatus(); renderSettings(); updateLoginInstall();
  });
  window.addEventListener('appinstalled', ()=>{
    _installEvt=null;
    toast('已安装到桌面');
    updatePWAStatus(); renderSettings(); updateLoginInstall();
  });
  window.addEventListener('online',  ()=>{
    updatePWAStatus(); updateOnlineBadge(); toast('网络已恢复，正在同步…');
    Outbox.flush();
  });
  window.addEventListener('offline', ()=>{
    updatePWAStatus(); updateOnlineBadge(); toast('已离线，数据将先存本机');
  });
  updateOnlineBadge();
}

/* =========================================================================
   24. 启动
   ========================================================================= */
async function loadAll(){
  await loadSettings();
  const d=await Data.load();
  ['patients','appts','images','stock','reminders','items','imgcats','words','rosters'].forEach(k=>{ S[k]=d[k]||[]; });
  S.schedule=(d.schedule&&d.schedule.xy)||{};
  S.bigSchedule=(d.schedule&&d.schedule.big)||{};
  /* 演示数据只在「从没导入过真实排班」且「用户没清过」时补一次 */
  if(!S.bigSchedule || !Object.keys(S.bigSchedule).length){
    if(S.settings.demoCleared===true){
      // 用户已清空过演示数据：顺手把残留的演示 blob 也抹掉
      if(S.schedule && Object.keys(S.schedule).length){ S.schedule={}; await saveSchedule(); }
    }else if(!S.schedule || !Object.keys(S.schedule).length){
      const xy={}; DEMO_SCHEDULE.rows.forEach(([dd,s])=>xy[dd]=s);
      S.schedule=xy; await saveSchedule();
    }
  }
  if(!S.items.length){
    for(const n of DEFAULT_ITEMS) await Data.put('items',{id:uid(),name:n});
  }
  if(!S.words.length){
    for(const n of DEFAULT_WORDS) await Data.put('words',{id:uid(),name:n});
  }
  if(!S.imgcats.length){
    for(const n of DEFAULT_CATS) await Data.put('imgcats',{id:uid(),name:n});
  }else if(!S.imgcats.find(c=>c.name==='预约本')){
    await Data.put('imgcats',{id:uid(),name:'预约本'});   // 拍照录入用得到
  }
  S.imaging.cat=(S.imgcats[0]||{}).name||'面照';
  /* 真实姓名只取自本账号在「设置」里显式填写的值，登录账号名不参与匹配 */
  S.me = Auth.realName() || '';
  await autoBindMyName();
  S.me = myName();
}
async function bootApp(){
  await loadAll();
  applySettings();
  renderSidebar();
  const first = !window.__booted;
  if(first){
    window.__booted = true;
    initEdgeGesture();
    initFab();
    $('#btnMenu').onclick=()=>toggleSidebar();
    $('#bigAdd').onclick=openAddMenu;
    const _tbAdd=$('#tbAdd'); if(_tbAdd) _tbAdd.onclick=openAddMenu;
    const setNav=document.querySelector('.sb-bottom .nav');
    if(setNav) setNav.onclick=()=>{ go('settings'); if(!isDesktop()) closeSidebar(); };
    setInterval(checkAlarms,1000);
    const unlock=()=>{ try{ ac().resume(); }catch(e){}
      document.removeEventListener('touchstart',unlock); document.removeEventListener('click',unlock); };
    document.addEventListener('touchstart',unlock);
    document.addEventListener('click',unlock);
  }
  setSidebar(isDesktop());
  const t=todayStr();
  const mine=mySchedule();
  S.selDate = mine[t] ? t : (Object.keys(mine).sort()[0] || t);
  S.calMonth = S.selDate.slice(0,7);
  _navStack=[];
  go('calendar',{reset:true});
}
(async function(){
  buildPWA();
  registerSW();                   // 注册 Service Worker（非 http(s) 环境自动跳过）
  applyDisplayMode();             // 检测是否以 App（standalone）方式运行
  /* PWA 事件必须在启动时就绑好：beforeinstallprompt 可能在任何时刻触发，
     如果等到登录后才绑（bootApp 里），登录页的安装按钮就永远收不到事件。 */
  initPWAEvents();
  await loadSettings();
  await maybeRestoreEmbedded();   // 若本文件内嵌了离线整包数据，先恢复再启动
  applySettings();
  refreshLoginTip();
  const sess=Auth.current();
  if(sess && sess.account){
    /* 云端模式：用 refresh_token 恢复登录令牌。
       恢复失败不阻断进入（离线也能用），但要在控制台留痕，方便排查。 */
    if(CLOUD_ON() && sess.mode==='cloud'){
      try{
        const ok = await CB.restore();
        if(!ok) console.warn('[auth] 刷新令牌失效，需重新登录（退出后重新登录即可）');
      }catch(e){ console.warn('[auth] 恢复登录态失败：', e && e.message); }
    }
    enterApp(sess);
  }
  initLogin();
  Outbox.refreshUI();
})();
</script>
